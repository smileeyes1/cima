<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محرك منهج الرياضيات الذكي - مطوّر</title>

<style>

*{
  box-sizing:border-box;
  font-family:"Cairo","Tahoma",sans-serif;
}

body{
  margin:0;
  background:#eaf2f3;
}

/* لوحة التحكم */
.panel{
  background:#fff;
  padding:15px;
  border-bottom:3px solid #2e7d32;
}

.row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

label{
  font-size:12px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

.gen{background:#2e7d32;color:white;}
.prt{background:#1565c0;color:white;}

/* الصفحة */
.page{
  width:210mm;
  min-height:297mm;
  background:white;
  margin:15px auto;
  padding:12mm;
}

.title{
  text-align:center;
  font-size:24px;
  color:#1b5e20;
  font-weight:bold;
}

.subtitle{
  text-align:center;
  font-size:12px;
  color:#666;
}

.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:10px;
  font-size:11px;
}

.meta div{
  padding:6px;
  border-radius:6px;
  background:#f7f7f7;
  border:1px solid #ddd;
}

.student{
  margin-top:10px;
  padding:10px;
  border:2px dashed #888;
  border-radius:10px;
}

.line{
  display:inline-block;
  width:180px;
  border-bottom:1px solid #000;
}

/* السؤال */
.q{
  margin-top:12px;
  padding:12px;
  border-radius:14px;
  border:1px solid #d0d7de;
  background:linear-gradient(180deg,#fff,#f8fafb);
}

.q-header{
  font-size:13px;
  font-weight:bold;
  color:#2e7d32;
  margin-bottom:6px;
}

.visual{
  text-align:center;
  font-size:18px;
  margin:6px 0;
}

.math{
  display:flex;
  justify-content:center;
  gap:8px;
  font-size:22px;
  align-items:center;
}

.answer{
  width:55px;
  height:34px;
  border:2px dashed #444;
  border-radius:6px;
}

/* طباعة */
@media print{
  .panel{display:none;}
  body{background:white;}
  .page{margin:0;}
}

@page{size:A4;margin:0;}

</style>
</head>

<body>

<div class="panel">

<h3>محرك المنهج الذكي (نسخة مطوّرة)</h3>

<div class="row">

<div>
<label>المهارة</label>
<select id="skill">
<option value="count">العدّ</option>
<option value="compare">المقارنة</option>
<option value="order">الترتيب</option>
<option value="add">الجمع</option>
<option value="sub">الطرح</option>
<option value="word">مسألة لفظية</option>
<option value="place">القيمة المكانية</option>
</select>
</div>

<div>
<label>الحد العددي</label>
<select id="limit">
<option value="10">ضمن 10</option>
<option value="20">ضمن 20</option>
<option value="100">ضمن 100</option>
</select>
</div>

<div>
<label>عدد الأسئلة</label>
<input id="count" type="number" value="10">
</div>

<div>
<label>اسم الدرس</label>
<input id="lesson" value="رياضيات">
</div>

</div>

<div class="row">

<div>
<label>المعلم</label>
<input id="teacher" value="المعلم">
</div>

<div>
<label>المدرسة</label>
<input id="school" value="مدرسة">
</div>

<div>
<label>إجابات</label>
<select id="answers">
<option value="no">لا</option>
<option value="yes">نعم</option>
</select>
</div>

<div></div>

</div>

<button class="gen" onclick="build()">توليد</button>
<button class="prt" onclick="window.print()">طباعة</button>

</div>

<div id="out"></div>

<script>

/* أرقام شرقية */
function ar(n){
  return String(n).replace(/[0-9]/g,d=>
    ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][d]
  );
}

function rand(max){
  return Math.floor(Math.random()*(max+1));
}

/* ================= توليد ================= */

function generate(skill,limit){

  let a,b,c;

  if(skill==="count"){
    return {type:"count",a:rand(limit)};
  }

  if(skill==="compare"){
    return {type:"compare",a:rand(limit),b:rand(limit)};
  }

  if(skill==="order"){
    return {type:"order",a:rand(limit),b:rand(limit),c:rand(limit)};
  }

  if(skill==="add"){
    do{
      a=rand(limit); b=rand(limit);
    }while(a+b>limit);
    return {type:"add",a,b};
  }

  if(skill==="sub"){
    a=rand(limit);
    b=rand(a);
    return {type:"sub",a,b};
  }

  if(skill==="word"){
    return {type:"word",a:rand(limit),b:rand(limit)};
  }

  if(skill==="place"){
    return {type:"place",a:rand(limit),b:rand(limit)};
  }
}

/* ================= تحقق متعدد الطبقات ================= */

function validate(data,skill,limit){

  if(skill==="add" && data.a + data.b > limit) return false;
  if(skill==="sub" && data.b > data.a) return false;

  if(skill==="order"){
    if(data.a===data.b || data.b===data.c || data.a===data.c) return false;
  }

  return true;
}

/* ================= حلقة الاستقرار ================= */

function stableGenerate(skill,limit){

  let data;
  let tries = 0;

  while(tries < 20){

    data = generate(skill,limit);

    if(validate(data,skill,limit)){
      return data;
    }

    tries++;
  }

  // حالة طوارئ آمنة
  return {type:"count",a:1};
}

/* ================= عرض السؤال ================= */

function render(i,data){

  if(data.type==="add"){
    return `
    <div class="q">
      <div class="q-header">جمع</div>
      <div class="visual">🍎➕🍌</div>
      <div class="math">
        <span>${ar(data.a)}</span>
        <span>+</span>
        <span>${ar(data.b)}</span>
        <span>=</span>
        <span class="answer"></span>
      </div>
    </div>`;
  }

  if(data.type==="sub"){
    return `
    <div class="q">
      <div class="q-header">طرح</div>
      <div class="visual">🍎➖🍌</div>
      <div class="math">
        <span>${ar(data.a)}</span>
        <span>-</span>
        <span>${ar(data.b)}</span>
        <span>=</span>
        <span class="answer"></span>
      </div>
    </div>`;
  }

  if(data.type==="compare"){
    return `
    <div class="q">
      <div class="q-header">قارن</div>
      <div class="math">
        <span>${ar(data.a)}</span>
        <span>___</span>
        <span>${ar(data.b)}</span>
      </div>
    </div>`;
  }

  if(data.type==="order"){
    return `
    <div class="q">
      <div class="q-header">رتب</div>
      <div class="math">
        <span>${ar(data.a)}</span>
        <span>${ar(data.b)}</span>
        <span>${ar(data.c)}</span>
      </div>
    </div>`;
  }

  if(data.type==="count"){
    return `
    <div class="q">
      <div class="q-header">عدّ</div>
      <div class="visual">⭐ ⭐ ⭐</div>
      <div class="math">
        <span class="answer"></span>
      </div>
    </div>`;
  }

  return `<div class="q"><div class="q-header">سؤال</div></div>`;
}

/* ================= بناء ================= */

function build(){

  let skill=document.getElementById("skill").value;
  let limit=parseInt(document.getElementById("limit").value);
  let count=parseInt(document.getElementById("count").value);
  let lesson=document.getElementById("lesson").value;
  let teacher=document.getElementById("teacher").value;
  let school=document.getElementById("school").value;

  let html=`
  <div class="page">

    <div class="title">${lesson}</div>
    <div class="subtitle">محرك منهج رياضيات ذكي - الصفوف الأولى</div>

    <div class="meta">
      <div>المعلم: ${teacher}</div>
      <div>المدرسة: ${school}</div>
      <div>الحد: ${ar(limit)}</div>
    </div>

    <div class="student">
      اسم الطالب: <span class="line"></span>
    </div>
  `;

  for(let i=1;i<=count;i++){
    let data = stableGenerate(skill,limit);
    html += render(i,data);
  }

  html += `</div>`;

  document.getElementById("out").innerHTML = html;
}

build();

</script>

</body>
</html>
