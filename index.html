<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>درس الجمع بالقلوب – ملء الشاشة</title>

<style>
*{box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:"Tajawal",Arial;
}

body{
  background:linear-gradient(#e0f7fa,#ffffff);
  display:flex;
  justify-content:center;
  align-items:center;
  color:#00695c;
}

/* زر ملء الشاشة */
.full-btn{
  position:fixed;
  top:10px;
  right:10px;
  z-index:999;
  padding:8px 14px;
  border-radius:10px;
  background:#26a69a;
  color:white;
  border:none;
  font-size:14px;
}

/* الحاوية */
.container{
  width:100vw;
  height:100vh;
  padding:3vh 3vw;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* البطاقة */
.card{
  width:100%;
  height:100%;
  background:white;
  border-radius:0;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
  padding:20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* الشخصيات */
.character{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.avatar{font-size:48px}
.name{font-weight:bold;font-size:22px}

/* الفقاعة */
.speech{
  width:100%;
  max-width:700px;
  background:#e0f2f1;
  border-radius:16px;
  padding:14px 16px 14px 48px;
  position:relative;
  font-size:18px;
  margin:10px 0;
  text-align:center;
}

.voice-btn{
  position:absolute;
  left:10px;
  top:10px;
  width:30px;
  height:30px;
  border:none;
  border-radius:50%;
  background:#26a69a;
  color:white;
  font-size:16px;
}

/* السؤال */
.question{
  font-size:36px;
  font-weight:bold;
  margin:10px 0;
}

/* القلوب */
.hearts-row{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin:8px 0;
}
.heart{
  font-size:34px;
  animation:glow 1.5s infinite alternate;
}
@keyframes glow{
  from{transform:scale(1);opacity:.7}
  to{transform:scale(1.25);opacity:1}
}

input{
  font-size:26px;
  width:100px;
  text-align:center;
  border-radius:12px;
  border:3px solid #80cbc4;
  padding:8px;
}

button{
  margin-top:12px;
  padding:10px 22px;
  font-size:18px;
  border:none;
  border-radius:14px;
  background:#26a69a;
  color:white;
}

@media(max-width:600px){
  .question{font-size:28px}
  .heart{font-size:28px}
  .name{font-size:18px}
}
</style>
</head>

<body>

<button class="full-btn" onclick="goFull()">⛶ ملء الشاشة</button>

<div class="container">

<!-- المقدمة -->
<div id="intro" class="card">
  <div class="character">
    <div class="avatar">🧔🏻‍♂️</div>
    <div class="name">الحكيم إبراهيم</div>
  </div>

  <div class="speech" id="introText">
    مرحبًا بك يا بطل. سنتعلم اليوم الجمع بهدوء ومحبة. خذ وقتك، فالله مع الصابرين.
  </div>
  <button class="voice-btn" onclick="speak(introText.innerText)">🔊</button>

  <p>اسم الطالب:</p>
  <input id="studentName">

  <p>اسم ولي الأمر:</p>
  <input id="parentName">

  <button onclick="start()">ابدأ الدرس</button>
</div>

<!-- الدرس -->
<div id="lesson" class="card" style="display:none">

  <div class="character">
    <div class="avatar">👨‍🏫</div>
    <div class="name">المعلم محمد</div>
  </div>

  <div class="speech" id="teacherText"></div>
  <button class="voice-btn" onclick="speak(teacherText.innerText)">🔊</button>

  <div class="question" id="question"></div>

  <div id="heartsA" class="hearts-row"></div>
  <div style="font-size:26px;font-weight:bold">+</div>
  <div id="heartsB" class="hearts-row"></div>
  <div id="heartsResult" class="hearts-row"></div>

  <input type="number" id="answer" placeholder="الناتج">
  <button onclick="check()">تحقق</button>

  <div id="nextArea" style="display:none">
    <button id="nextBtn" disabled onclick="nextQ()">التالي (١٠)</button>
  </div>

</div>
</div>

<script>
let student="",parent="";
let a=0,b=0;
let timer=null,countDown=10;

// ملء الشاشة
function goFull(){
  if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen();
  }
}

// صوت عربي محسّن قدر الإمكان
function speak(text){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const voices=speechSynthesis.getVoices();
  const ar=voices.find(v=>v.lang.startsWith("ar"));
  if(ar) u.voice=ar;
  u.lang="ar-SA";
  u.rate=0.9;
  u.pitch=1.1;
  speechSynthesis.speak(u);
}

// أرقام شرقية
function eastern(n){
  return n.toString().replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
}

// قلوب
function hearts(id,n){
  const el=document.getElementById(id);
  el.innerHTML="";
  for(let i=0;i<n;i++){
    const h=document.createElement("span");
    h.className="heart";
    h.innerText="❤";
    el.appendChild(h);
  }
}

// بدء
function start(){
  student=studentName.value||"بطلنا";
  parent=parentName.value||"ولي أمره الكريم";
  intro.style.display="none";
  lesson.style.display="flex";
  newQ();
}

// سؤال جديد
function newQ(){
  a=Math.floor(Math.random()*5)+1;
  b=Math.floor(Math.random()*5)+1;

  teacherText.innerText=
  `يا ${student}، انظر إلى القلوب وعدّها معي بهدوء. الجمع يعني أننا نضم الأشياء معًا.`;
  speak(teacherText.innerText);

  question.innerText=`${eastern(a)} + ${eastern(b)}`;
  hearts("heartsA",a);
  hearts("heartsB",b);
  hearts("heartsResult",0);

  answer.value="";
  nextArea.style.display="none";
}

// تحقق
function check(){
  if(Number(answer.value)==a+b){
    hearts("heartsResult",a+b);
    teacherText.innerText=
    `أحسنت يا ${student}. محاولتك عبادة جميلة، والله يبارك فيك.`;
    speak(teacherText.innerText);
    startTimer();
  }else{
    speak(`لا بأس يا ${student}. خذ نفسًا عميقًا، والله مع الصابرين.`);
  }
}

// مؤقت
function startTimer(){
  nextArea.style.display="block";
  countDown=10;
  nextBtn.disabled=true;
  nextBtn.innerText=`التالي (${countDown})`;
  timer=setInterval(()=>{
    countDown--;
    nextBtn.innerText=`التالي (${countDown})`;
    if(countDown<=0){
      clearInterval(timer);
      nextBtn.disabled=false;
      nextBtn.innerText="التالي";
    }
  },1000);
}

function nextQ(){ newQ(); }
</script>

</body>
</html>
