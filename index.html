<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>محاكاة حصص رياضيات الصف الأول</title>

  <!-- مكتبة ZIP -->
  https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.jsscript>
  <!-- مكتبة حفظ الملفات -->
  https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.jsscript>

  <style>
    body {
      font-family: Arial, sans-serif;
      direction: rtl;
      text-align: right;
      padding: 20px;
      background-color: #f4f6f7;
    }
    h2 {
      color: #2e7d32;
    }
    button {
      font-size: 18px;
      padding: 14px 24px;
      background-color: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #1b5e20;
    }
    p {
      margin-bottom: 16px;
    }
  </style>
</head>

<body>

<h2>📘 محاكاة حصص رياضيات (1)</h2>
<p>خطة واقعية كاملة لكل دروس الصف الأول – مناسبة للمعلم الفلسطيني</p>

<button onclick="generateZip()">إنشاء وتنزيل ملف ZIP</button>

<script>
function lessonTemplate(title) {
  return `
# ${title}

## الهدف السلوكي
أن يتعرّف الطالب على مفهوم الدرس ويطبّقه في مواقف حياتية بسيطة من واقعه.

## التمهيد
حوار قصير من البيئة الفلسطينية (الصف، البيت، الشارع، الأسرة).

## خطوات الشرح
1. مناقشة شفوية بأسئلة بسيطة.
2. استخدام المحسوسات (الأصابع، الحجارة، الأقلام).
3. تطبيق جماعي مع الطلاب.

## نشاط صفّي
نشاط حركي أو تمثيلي لا يحتاج وسائل أو أوراق.

## التقويم
سؤال شفوي + مثال تطبيقي سريع.

## واجب منزلي
مهمة خفيفة من واقع حياة الطالب اليومية.
`;
}

function generateZip() {
  const zip = new JSZip();
  let lessonNo = 1;

  const units = {
    "الوحدة_الأولى": [
      "العدد واحد","العدد اثنان","العدد ثلاثة","العدد أربعة","العدد خمسة",
      "العدد ستة","العدد سبعة","العدد ثمانية","العدد تسعة",
      "مقارنة عددين","الترتيب التصاعدي","الترتيب التنازلي",
      "العدد التالي","العدد السابق","العدد الترتيبي"
    ],
    "الوحدة_الثانية": [
      "الصفر","مكونات الأعداد (أولاً)","مكونات الأعداد (ثانياً)",
      "الجمع ضمن 9","الطرح ضمن 9","العلاقة بين الجمع والطرح",
      "العدد 10","الأعداد 11–19","العدد 20"
    ],
    "الوحدة_الثالثة": [
      "العدد التالي","العدد السابق","المقارنة بين عددين",
      "الترتيب التصاعدي","الترتيب التنازلي",
      "القيمة المنزلية","الصورة الموسعة",
      "الجمع ضمن 10","الجمع ضمن 18 (أولاً)","الجمع ضمن 18 (ثانياً)"
    ],
    "الوحدة_الرابعة": [
      "الطرح ضمن 10","الطرح ضمن 18 (أولاً)","الطرح ضمن 18 (ثانياً)","الطرح ضمن 18 (ثالثاً)",
      "الأعداد 21–29","تمثيل الأعداد","الأعداد 30–99",
      "مضاعفات العشرة","الخط المستقيم والمنحني",
      "الأشكال الهندسية","المجسمات","أجزاء الشكل (نصف – ربع)"
    ]
  };

  for (const unit in units) {
    const folder = zip.folder(unit);
    units[unit].forEach(title => {
      folder.file(`درس_${lessonNo}_${title}.md`, lessonTemplate(title));
      lessonNo++;
    });
  }

  zip.file(
    "README.md",
    "محاكاة صفية كاملة لجميع دروس رياضيات الصف الأول وفق المنهاج الفلسطيني."
  );

  zip.generateAsync({type:"blob"}).then(blob => {
    saveAs(blob, "Math1_All_Lessons_Simulation.zip");
  });
}
</script>

</body>
</html>
