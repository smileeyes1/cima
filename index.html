<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>النظام الذكي للمرحلة الابتدائية</title>

<style>

/* =========================
   الأساس
========================= */

*{
  box-sizing:border-box;
  font-family:"Cairo","Tahoma",sans-serif;
}

body{
  margin:0;
  background:#eef2f1;
}

/* =========================
   لوحة التحكم
========================= */

.panel{
  background:white;
  padding:16px;
  border-bottom:3px solid #2e7d32;
}

.row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

label{
  font-size:12px;
  font-weight:bold;
  display:block;
  margin-top:8px;
}

input,select{
  width:100%;
  padding:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:12px;
}

button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

.gen{background:#2e7d32;color:white;}
.prt{background:#1565c0;color:white;}

/* =========================
   صفحة A4
========================= */

.page{
  width:210mm;
  min-height:297mm;
  background:white;
  margin:15px auto;
  padding:10mm;
}

/* =========================
   الترويسة الذكية
========================= */

.title{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#1b5e20;
}

.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  font-size:11px;
  margin-top:8px;
}

.meta div{
  border:1px solid #ddd;
  padding:6px;
  border-radius:6px;
  background:#fafafa;
}

/* =========================
   مستويات تربوية
========================= */

.level{
  margin:10px 0;
  padding:6px 10px;
  border-radius:10px;
  font-size:12px;
  font-weight:bold;
  color:white;
}

.l1{background:#43a047;}
.l2{background:#1e88e5;}
.l3{background:#fb8c00;}
.l4{background:#8e24aa;}

/* =========================
   سؤال
========================= */

.q{
  border:1px solid #cfd8dc;
  border-radius:10px;
  padding:8px;
  margin-top:8px;
}

/* محسوس */
.dot{
  width:14px;height:14px;
  border-radius:50%;
  border:2px solid #43a047;
  display:inline-block;
  margin:2px;
}

/* شبه محسوس */
.box{
  width:12px;height:12px;
  border:2px solid #1e88e5;
  display:inline-block;
  margin:2px;
}

.math{
  display:flex;
  justify-content:center;
  gap:6px;
  font-size:18px;
  margin-top:6px;
}

.answer{
  width:45px;
  height:30px;
  border:2px dashed #444;
  border-radius:6px;
}

/* الطباعة */
@media print{
  .panel{display:none;}
  body{background:white;}
  .page{margin:0;}
}

@page{
  size:A4;
  margin:0;
}

</style>
</head>

<body>

<!-- =========================
   لوحة التحكم
========================= -->

<div class="panel">

<h3>النظام الذكي</h3>

<div class="row">

<div>
<label>الصف</label>
<select id="grade">
<option value="1">الأول</option>
<option value="2" selected>الثاني</option>
<option value="3">الثالث</option>
<option value="4">الرابع</option>
</select>
</div>

<div>
<label>الدرس</label>
<input id="lesson" value="الجمع">
</div>

<div>
<label>عدد الأسئلة</label>
<input id="count" type="number" value="10">
</div>

<div>
<label>المعلم</label>
<input id="teacher" value="المعلم">
</div>

</div>

<div class="buttons">
<button class="gen" onclick="build()">توليد ذكي</button>
<button class="prt" onclick="window.print()">طباعة</button>
</div>

</div>

<!-- الورقة -->
<div id="out"></div>

<script>

/* =========================
   أرقام شرقية
========================= */

function ar(n){
  return n.toString().replace(/[0-9]/g,d=>
    ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][d]
  );
}

/* =========================
   منطق حسب الصف
========================= */

function levelConfig(g){

  if(g==1){
    return {max:5, visual:true};
  }

  if(g==2){
    return {max:10, visual:true};
  }

  if(g==3){
    return {max:20, visual:false};
  }

  return {max:50, visual:false};
}

/* =========================
   سؤال ذكي
========================= */

function q(i,conf){

  let a=Math.floor(Math.random()*conf.max);
  let b=Math.floor(Math.random()*(conf.max-a));

  let visual="";

  if(conf.visual){
    visual = Array(a).fill('<span class="dot"></span>').join('');
  }

  return `
  <div class="q">

    <b>سؤال ${ar(i)}</b>

    <div style="text-align:center;margin-top:6px">
      ${visual}
    </div>

    <div class="math">
      <span>${ar(a)}</span>
      <span>+</span>
      <span>${ar(b)}</span>
      <span>=</span>
      <span class="answer"></span>
    </div>

  </div>
  `;
}

/* =========================
   بناء الورقة الذكية
========================= */

function build(){

  let grade=document.getElementById("grade").value;
  let lesson=document.getElementById("lesson").value;
  let count=parseInt(document.getElementById("count").value);
  let teacher=document.getElementById("teacher").value;

  let conf=levelConfig(grade);

  let levelName = grade==1?"محسوس":grade==2?"شبه محسوس":grade==3?"انتقال":"مجرد";

  let html=`
  <div class="page">

    <div class="title">${lesson}</div>

    <div class="meta">
      <div>الصف: ${grade}</div>
      <div>المعلم: ${teacher}</div>
      <div>المستوى: ${levelName}</div>
      <div>فهم</div>
      <div>مهارة</div>
      <div>تطبيق</div>
    </div>

    <div class="level l${grade}">
      تدرج: الفهم → المهارة → التطبيق
    </div>
  `;

  for(let i=1;i<=count;i++){
    html+=q(i,conf);
  }

  html+=`</div>`;

  document.getElementById("out").innerHTML=html;
}

build();

</script>

</body>
</html>
