<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد أوراق العمل</title>

<style>

/* =========================
   الأساس
========================= */

*{
  box-sizing:border-box;
  font-family:"Cairo","Tahoma",sans-serif;
}

body{
  margin:0;
  background:#eef2f1;
}

/* =========================
   لوحة التحكم (تظهر دائمًا)
========================= */

.panel{
  background:#ffffff;
  padding:15px;
  border-bottom:3px solid #2e7d32;
}

.panel h2{
  margin:0 0 10px 0;
  color:#1b5e20;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

label{
  font-size:12px;
  font-weight:bold;
  display:block;
  margin-top:8px;
}

input,select{
  width:100%;
  padding:8px;
  border:1px solid #ccc;
  border-radius:8px;
}

/* أزرار */
.actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}

button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.print{
  background:#1565c0;
  color:white;
}

.generate{
  background:#2e7d32;
  color:white;
}

/* =========================
   صفحة A4
========================= */

.page{
  width:210mm;
  min-height:297mm;
  margin:20px auto;
  background:white;
  padding:10mm;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

/* =========================
   الترويسة
========================= */

.title{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#1b5e20;
}

.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  font-size:11px;
  margin-top:10px;
}

.meta div{
  border:1px solid #ddd;
  padding:6px;
  border-radius:6px;
  background:#fafafa;
}

/* =========================
   الأسئلة
========================= */

.q{
  border:1px solid #cfd8dc;
  padding:8px;
  margin-top:10px;
  border-radius:10px;
}

.math{
  display:flex;
  justify-content:center;
  gap:8px;
  font-size:18px;
  margin-top:6px;
}

.answer{
  width:45px;
  height:30px;
  border:2px dashed #555;
  border-radius:6px;
}

/* أشكال مضمونة الطباعة */
.dot{
  width:14px;
  height:14px;
  border-radius:50%;
  border:2px solid #43a047;
  display:inline-block;
  margin:2px;
}

/* =========================
   الطباعة (هنا الحل الحقيقي)
========================= */

@media print{

  .panel{
    display:none !important;
  }

  body{
    background:white;
  }

  .page{
    margin:0;
    box-shadow:none;
  }
}

@page{
  size:A4;
  margin:0;
}

</style>
</head>

<body>

<!-- =========================
   لوحة التحكم (أساسية)
========================= -->

<div class="panel">

<h2>لوحة التحكم</h2>

<div class="grid">

<div>
<label>اسم الدرس</label>
<input id="lesson" value="الجمع ضمن ١٠">
</div>

<div>
<label>المدرسة</label>
<input id="school" value="مدرسة فلسطين">
</div>

<div>
<label>المديرية</label>
<input id="directorate" value="مديرية نابلس">
</div>

<div>
<label>الصف</label>
<select id="grade">
<option>الأول</option>
<option selected>الثاني</option>
<option>الثالث</option>
</select>
</div>

<div>
<label>المعلم</label>
<input id="teacher" value="الأستاذ محمد">
</div>

<div>
<label>عدد الأسئلة</label>
<input id="count" type="number" value="10">
</div>

</div>

<div class="actions">
<button class="generate" onclick="generate()">توليد</button>
<button class="print" onclick="window.print()">طباعة</button>
</div>

</div>

<!-- =========================
   الورقة
========================= -->

<div id="out"></div>

<script>

function ar(n){
  return n.toString().replace(/[0-9]/g,d=>
    ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][d]
  );
}

function r(a,b){
  return Math.floor(Math.random()*(b-a+1))+a;
}

function q(i){

  let a=r(0,10);
  let b=r(0,10-a);

  return `
  <div class="q">

    <b>السؤال ${ar(i)}</b>

    <div style="text-align:center;margin-top:6px">
      ${Array(a).fill('<span class="dot"></span>').join('')}
    </div>

    <div class="math">
      <span>${ar(a)}</span>
      <span>+</span>
      <span>${ar(b)}</span>
      <span>=</span>
      <span class="answer"></span>
    </div>

  </div>
  `;
}

function generate(){

  const lesson=document.getElementById("lesson").value;
  const school=document.getElementById("school").value;
  const directorate=document.getElementById("directorate").value;
  const grade=document.getElementById("grade").value;
  const teacher=document.getElementById("teacher").value;
  const count=parseInt(document.getElementById("count").value);

  let html=`
  <div class="page">

    <div class="title">${lesson}</div>

    <div class="meta">
      <div>المدرسة: ${school}</div>
      <div>المديرية: ${directorate}</div>
      <div>الصف: ${grade}</div>
      <div>المعلم: ${teacher}</div>
      <div>هدف: مهارة الجمع</div>
      <div>زمن: 40 دقيقة</div>
    </div>
  `;

  for(let i=1;i<=count;i++){
    html+=q(i);
  }

  html+=`</div>`;

  document.getElementById("out").innerHTML=html;
}

generate();

</script>

</body>
</html>
