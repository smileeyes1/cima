<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قصة العدل</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#ffffff;
}
main{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:١٢px;
  box-sizing:border-box;
}

.top{
  text-align:center;
}
.character{
  font-size:٣.٥rem;
}
.story{
  margin-top:٨px;
  padding:٨px;
  border:٢px solid #000;
  border-radius:١٢px;
  font-size:١.١rem;
}

.plates{
  display:flex;
  justify-content:space-around;
  margin:١٢px ٠;
}
.plate{
  width:٦٥px;
  height:٦٥px;
  border:٢px solid #000;
  border-radius:٥٠%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:٢rem;
}

.apple-area{
  text-align:center;
  font-size:٢.٥rem;
  min-height:٣rem;
}

.controls{
  display:flex;
  justify-content:center;
  margin-bottom:٨px;
}
button{
  min-height:٥٦px;
  padding:٠ ٢٤px;
  font-size:١.١rem;
  border:٢px solid #000;
  background:#fff;
}
.hidden{display:none;}
</style>
</head>

<body>
<main>

<div class="top">
  <div class="character">🧒</div>
  <div class="story" id="text">لدينا تفاح…</div>
</div>

<div class="plates">
  <div class="plate" id="p1">🍽️</div>
  <div class="plate" id="p2">🍽️</div>
  <div class="plate" id="p3">🍽️</div>
  <div class="plate" id="p4">🍽️</div>
</div>

<div class="apple-area" id="apples">🍎 🍎 🍎 🍎 🍎 🍎 🍎 🍎</div>

<div class="controls">
  <button onclick="step()">ضع تفاحة</button>
</div>

</main>

<script>
let stepCount = ٠;
let plates = [p1,p2,p3,p4];
let applesLeft = ٨;

function step(){
  if(applesLeft === ٠) return;

  plates[stepCount % 4].textContent += "🍎";
  applesLeft--;
  apples.textContent = "🍎 ".repeat(applesLeft);

  stepCount++;

  if(stepCount === ١){
    text.textContent = "تفاحة هنا… وتفاحة هناك…";
  }
  if(stepCount === ٤){
    text.textContent = "هل هذا عادل؟";
  }
  if(stepCount === ٨){
    text.textContent = "✅ الآن أصبح التوزيع عادلًا";
  }
}
</script>

</body>
</html>
