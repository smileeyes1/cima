<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>النظام المحبب للأطفال - أوراق عمل ذكية</title>

<style>

/* =========================
   الأساس
========================= */

*{
  box-sizing:border-box;
  font-family:"Cairo","Tahoma",sans-serif;
}

body{
  margin:0;
  background:#eef2f1;
}

/* =========================
   لوحة التحكم
========================= */

.panel{
  background:white;
  padding:15px;
  border-bottom:3px solid #2e7d32;
}

.row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

label{
  font-size:12px;
  font-weight:bold;
  display:block;
  margin-top:8px;
}

input,select{
  width:100%;
  padding:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.gen{background:#2e7d32;color:white;}
.prt{background:#1565c0;color:white;}

/* =========================
   الصفحة
========================= */

.page{
  width:210mm;
  min-height:297mm;
  background:white;
  margin:15px auto;
  padding:10mm;
}

/* =========================
   الترويسة
========================= */

.title{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#1b5e20;
}

.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  font-size:11px;
  margin-top:8px;
}

.meta div{
  border:1px solid #ddd;
  padding:6px;
  border-radius:6px;
  background:#fafafa;
}

/* =========================
   رموز محببة للأطفال
========================= */

.emoji{
  font-size:20px;
  margin:2px;
}

/* مستويات جاذبية */
.level{
  margin-top:10px;
  padding:6px;
  border-radius:10px;
  color:white;
  font-size:12px;
  font-weight:bold;
}

.l1{background:#43a047;}
.l2{background:#1e88e5;}
.l3{background:#fb8c00;}
.l4{background:#8e24aa;}

/* =========================
   السؤال
========================= */

.q{
  border:1px solid #cfd8dc;
  padding:8px;
  margin-top:8px;
  border-radius:10px;
}

.math{
  display:flex;
  justify-content:center;
  gap:6px;
  font-size:18px;
  margin-top:6px;
}

.answer{
  width:45px;
  height:30px;
  border:2px dashed #444;
  border-radius:6px;
}

/* =========================
   الطباعة
========================= */

@media print{
  .panel{display:none;}
  body{background:white;}
  .page{margin:0;}
}

@page{
  size:A4;
  margin:0;
}

</style>
</head>

<body>

<!-- لوحة التحكم -->
<div class="panel">

<h3>النظام المحبب للأطفال</h3>

<div class="row">

<div>
<label>الصف</label>
<select id="grade">
<option value="1">الأول</option>
<option value="2" selected>الثاني</option>
<option value="3">الثالث</option>
<option value="4">الرابع</option>
</select>
</div>

<div>
<label>الدرس</label>
<input id="lesson" value="الجمع">
</div>

<div>
<label>عدد الأسئلة</label>
<input id="count" type="number" value="10">
</div>

<div>
<label>المعلم</label>
<input id="teacher" value="المعلم">
</div>

</div>

<button class="gen" onclick="build()">توليد</button>
<button class="prt" onclick="window.print()">طباعة</button>

</div>

<!-- الورقة -->
<div id="out"></div>

<script>

/* أرقام شرقية */
function ar(n){
  return n.toString().replace(/[0-9]/g,d=>
    ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][d]
  );
}

/* رموز حسب الصف */
function emojisByGrade(g){

  if(g==1){
    return ["🍎","❤️"];
  }
  if(g==2){
    return ["🍎","🍌","⭐"];
  }
  if(g==3){
    return ["⭐","📘"];
  }
  return ["📘","🧠"];
}

/* سؤال */
function q(i,a,b,em){

  let icons = Array(a).fill(`<span class="emoji">${em[0]}</span>`).join('');

  return `
  <div class="q">

    <b>السؤال ${ar(i)}</b>

    <div style="text-align:center;margin-top:6px">
      ${icons}
    </div>

    <div class="math">
      <span>${ar(a)}</span>
      <span>+</span>
      <span>${ar(b)}</span>
      <span>=</span>
      <span class="answer"></span>
    </div>

  </div>
  `;
}

/* بناء */
function build(){

  let g=document.getElementById("grade").value;
  let lesson=document.getElementById("lesson").value;
  let count=parseInt(document.getElementById("count").value);
  let teacher=document.getElementById("teacher").value;

  let em=emojisByGrade(g);

  let html=`
  <div class="page">

    <div class="title">${lesson}</div>

    <div class="meta">
      <div>الصف: ${g}</div>
      <div>المعلم: ${teacher}</div>
      <div>هدف: متعة التعلم</div>
      <div>فهم</div>
      <div>مهارة</div>
      <div>تطبيق</div>
    </div>

    <div class="level l${g}">
      تعلم ممتع باستخدام الرموز المحببة للأطفال
    </div>
  `;

  for(let i=1;i<=count;i++){

    let a=Math.floor(Math.random()*10);
    let b=Math.floor(Math.random()*(10-a));

    html+=q(i,a,b,em);
  }

  html+=`</div>`;

  document.getElementById("out").innerHTML=html;
}

build();

</script>

</body>
</html>
