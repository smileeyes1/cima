<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مغامرة بطل الكنوز السحرية</title>
<style>
body {
  margin: 0;
  font-family: "Tajawal", Arial, sans-serif;
  background: linear-gradient(#e0f7fa, #ffffff);
  text-align: center;
  color: #00695c;
}
.container { max-width: 440px; margin: auto; padding: 15px; }
.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin-top: 15px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.12);
}
.character { display: flex; align-items: center; gap: 12px; justify-content: center; }
.avatar { font-size: 42px; }
.name { font-weight: bold; font-size: 20px; color: #00695c; }
.speech {
  background: #e0f2f1;
  border-radius: 16px;
  padding: 14px;
  margin: 12px 0;
  position: relative;
  min-height: 70px;
}
.voice-btn {
  position: absolute; top: 8px; left: 8px;
  background: #26a69a; color: white; border: none;
  border-radius: 50%; width: 32px; height: 32px; font-size: 18px;
  cursor: pointer;
}
.question { font-size: 32px; margin: 25px 0; font-weight: bold; }
input {
  font-size: 26px;
  width: 100px;
  text-align: center;
  padding: 8px;
  border-radius: 12px;
  border: 3px solid #80cbc4;
}
button {
  margin: 10px 5px;
  padding: 10px 20px;
  font-size: 18px;
  border: none;
  border-radius: 14px;
  background: #26a69a;
  color: white;
  cursor: pointer;
}
.reward { margin: 20px 0; font-size: 24px; display: none; animation: pop 0.8s; }
.stars { font-size: 32px; margin: 10px 0; }
.circle { width: 60px; height: 60px; background: #ffca28; border-radius: 50%; margin: 15px auto; animation: pop 0.6s ease; }
@keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
.progress { height: 8px; background: #80cbc4; border-radius: 10px; margin: 15px 0; }
.name-input { width: 90%; padding: 10px; margin: 8px 0; border-radius: 12px; border: 2px solid #80cbc4; font-size: 18px; }
</style>
</head>
<body>
<div class="container">

<!-- المقدمة -->
<div id="intro" class="card">
  <div class="character"><div class="avatar">🧔🏻‍♂️</div><div class="name">الحكيم إبراهيم</div></div>
  <div class="speech" id="introText"></div>
  <button onclick="speak(document.getElementById('introText').innerText)" class="voice-btn">🔊</button>

  <p style="margin:15px 0 5px;">اسم الطالب الغالي:</p>
  <input id="studentName" class="name-input" placeholder="اكتب اسمك يا بطل">

  <p style="margin:5px 0;">اسم ولي الأمر الكريم:</p>
  <input id="parentName" class="name-input" placeholder="اسم الوالد أو الوالدة">

  <button onclick="startGame()" style="margin-top:20px;font-size:20px;padding:12px 30px;">ابدأ المغامرة</button>
</div>

<!-- اللعبة -->
<div id="game" class="card" style="display:none;">
  <div class="character">
    <span id="currentAvatar" style="font-size:42px;"></span>
    <div><div class="name" id="currentName"></div></div>
  </div>
  <div class="speech" id="teacherText"></div>
  <button onclick="speak(document.getElementById('teacherText').innerText)" class="voice-btn">🔊</button>

  <div class="question" id="question"></div>

  <input type="number" id="answer" placeholder="الناتج">
  <br>
  <button onclick="checkAnswer()">تحقق من إجابتي</button>

  <div class="reward" id="reward">
    <div id="rewardText"></div>
    <div class="stars" id="stars"></div>
    <div class="circle"></div>
  </div>

  <div id="nextSection" style="display:none;margin-top:20px;">
    <button id="nextBtn" onclick="handleNextClick()" disabled>التالي</button>
  </div>

  <div class="progress" id="progress"></div>
</div>

<!-- الخاتمة -->
<div id="end" class="card" style="display:none;">
  <h2 id="endTitle">🌟 مبروك يا بطل 🌟</h2>
  <div id="endText" style="font-size:20px;line-height:1.6;"></div>
  <button onclick="location.reload()" style="margin-top:20px;">العب المغامرة مرة أخرى</button>
</div>

</div>

<script>
// ==================== المتغيرات العامة ====================
let studentName = "بطلنا";
let parentName = "ولي أمره";
let currentLevel = 1;
let score = 0;
let stars = 0;
let count = 0;
let nextClickCount = 0;
let nextTimer = null;
let correctStreak = 0;

// شخصيات اللعبة
const characters = [
  { name: "الحكيم إبراهيم", avatar: "🧔🏻‍♂️" },
  { name: "المعلم محمد", avatar: "👨‍🏫" },
  { name: "طائر الصديق", avatar: "🐦" },
  { name: "الشجرة السحرية", avatar: "🌳" }
];

const introMessages = [
  "مرحبًا بك في غابة الجمع السحرية! أنا الحكيم إبراهيم.",
  "اليوم سنذهب في مغامرة رائعة لجمع الكنوز. هل أنت مستعد يا بطل؟"
];

const rewards = [
  "محاولتك عبادة جميلة 🌸 الله يبارك فيك!",
  "أحسنت يا بطل! الله يرى جهدك ويباركه ⭐",
  "يا سلام عليك! تقدمك يفرح قلبي 🌈"
];

// ==================== دوال مساعدة ====================
function eastern(n) {
  return n.toString().replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
}

function speak(text) {
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ar-SA';
    utterance.rate = 0.95;
    speechSynthesis.speak(utterance);
  }
}

function getRandomCharacter() {
  return characters[Math.floor(Math.random() * characters.length)];
}

// ==================== بداية اللعبة ====================
function introRandom() {
  document.getElementById("introText").innerText = introMessages[Math.floor(Math.random()*introMessages.length)];
}
introRandom();

function startGame() {
  studentName = document.getElementById("studentName").value.trim() || studentName;
  parentName = document.getElementById("parentName").value.trim() || parentName;

  document.getElementById("intro").style.display = "none";
  document.getElementById("game").style.display = "block";
  newQuestion();
}

function newQuestion() {
  let a, b;
  if (currentLevel === 1) {
    a = Math.floor(Math.random()*6)+1;
    b = Math.floor(Math.random()*(12-a))+1;
  } else {
    a = Math.floor(Math.random()*9)+1;
    b = Math.floor(Math.random()*(18-a))+1;
  }

  const char = getRandomCharacter();
  document.getElementById("currentAvatar").innerText = char.avatar;
  document.getElementById("currentName").innerText = char.name;

  const teacherMsg = `${studentName}، اجمع هذين العددين بهدوء ثم اكتب الناتج.`;
  document.getElementById("teacherText").innerText = teacherMsg;
  speak(teacherMsg);

  const qText = `في المغامرة وجدت ${eastern(a)} + ${eastern(b)} كنز سحري. كم كنزًا معنا الآن؟`;
  document.getElementById("question").innerText = qText;

  document.getElementById("answer").value = "";
  document.getElementById("reward").style.display = "none";
  document.getElementById("nextSection").style.display = "none";
  nextClickCount = 0;

  // تحديث شريط التقدم
  document.getElementById("progress").style.width = `${(count / 8) * 100}%`;
}

function checkAnswer() {
  const userAnswer = Number(document.getElementById("answer").value);
  const correctAnswer = parseInt(document.getElementById("question").innerText.match(/\d+/g).pop()) || 0; // استخراج الناتج الصحيح من النص (بسيط)

  // حساب الناتج الصحيح من السؤال (أفضل طريقة)
  const match = document.getElementById("question").innerText.match(/(\d+)\s*\+\s*(\d+)/);
  let a = match ? parseInt(match[1]) : 0;
  let b = match ? parseInt(match[2]) : 0;
  const realAnswer = a + b;

  if (userAnswer === realAnswer) {
    correctStreak++;
    score += 10;
    stars = Math.min(5, Math.floor(score / 20));

    const rewardMsg = rewards[Math.floor(Math.random()*rewards.length)];
    document.getElementById("rewardText").innerText = `${studentName}، ${rewardMsg}`;
    document.getElementById("stars").innerText = "⭐".repeat(stars);
    document.getElementById("reward").style.display = "block";

    count++;
    if (count >= 8) {
      setTimeout(showEnd, 1800);
    } else {
      if (correctStreak >= 3 && currentLevel === 1) {
        currentLevel = 2;
        speak(`ممتاز يا ${studentName}! الآن سننتقل إلى مستوى أصعب.`);
      }
      showNextButton();
    }
  } else {
    correctStreak = 0;
    const errorMsg = `لا بأس يا ${studentName}، خطأ بسيط. جرّب مرة أخرى بهدوء. الله مع الصابرين.`;
    document.getElementById("teacherText").innerText = errorMsg;
    speak(errorMsg);
  }
}

function showNextButton() {
  const nextSection = document.getElementById("nextSection");
  const nextBtn = document.getElementById("nextBtn");
  nextSection.style.display = "block";
  nextBtn.disabled = true;
  nextBtn.innerText = "التالي (١٠)";

  let timeLeft = 10;
  nextTimer = setInterval(() => {
    timeLeft--;
    nextBtn.innerText = `التالي (${timeLeft})`;
    if (timeLeft <= 0) {
      clearInterval(nextTimer);
      nextBtn.disabled = false;
      nextBtn.innerText = "التالي";
    }
  }, 1000);
}

function handleNextClick() {
  nextClickCount++;
  if (nextClickCount === 1) {
    document.getElementById("nextSection").style.display = "none";
    newQuestion();
  } else if (nextClickCount === 2) {
    document.getElementById("teacherText").innerText = `${studentName}، تذكر: الجمع يعني نضع العددين معًا كأننا نضم أصدقاء.`;
    speak(document.getElementById("teacherText").innerText);
  } else if (nextClickCount === 3) {
    document.getElementById("teacherText").innerText = `نشاط مفاجئ: اكتب في دفترك الآن ٣ + ٦ = ؟ ثم اضغط التالي مرة أخرى.`;
    speak(document.getElementById("teacherText").innerText);
  } else if (nextClickCount === 4) {
    document.getElementById("teacherText").innerText = `تذكر يا ${studentName}، كل محاولة ترفعك درجة عند الله. أنت قوي وأمين والنبي ﷺ يحب ذلك.`;
    speak(document.getElementById("teacherText").innerText);
  }
}

function showEnd() {
  document.getElementById("game").style.display = "none";
  const endCard = document.getElementById("end");
  
  document.getElementById("endTitle").innerHTML = `🌟 أحسنت يا ${studentName} 🌟`;
  
  let report = `
    <p>عزيزي ${parentName}،</p>
    <p>اجتهد ${studentName} اليوم في مغامرة الجمع السحرية وقد حصل على ${stars} نجوم ⭐</p>
    <p>عدد الأسئلة التي أجابها: ${count} من ٨</p>
    <p>أظهر صبرًا جميلًا وتعاونًا، وكل محاولة كانت عبادة مقبولة إن شاء الله.</p>
    <p>الله يبارك في ${studentName} ويجعله من المتعلمين الصالحين.</p>
  `;
  
  document.getElementById("endText").innerHTML = report;
  endCard.style.display = "block";
  
  // حفظ التقدم
  localStorage.setItem("lastStudent", studentName);
  localStorage.setItem("lastScore", score);
}
</script>
</body>
</html>
