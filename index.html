<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محرك منهج الرياضيات - الصفوف الأولى</title>

<style>

*{box-sizing:border-box;font-family:"Cairo","Tahoma",sans-serif;}
body{margin:0;background:#eef2f3;}

/* لوحة التحكم */
.panel{
  background:#fff;
  padding:15px;
  border-bottom:3px solid #2e7d32;
}

.row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

label{font-size:12px;font-weight:bold;display:block;margin-top:6px;}
input,select{width:100%;padding:8px;border-radius:8px;border:1px solid #ccc;}

button{
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

.gen{background:#2e7d32;color:white;}
.prt{background:#1565c0;color:white;}

/* الصفحة */
.page{
  width:210mm;
  min-height:297mm;
  background:white;
  margin:15px auto;
  padding:12mm;
}

.title{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  color:#1b5e20;
}

.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  font-size:11px;
  margin-top:10px;
}

.meta div{
  border:1px solid #ddd;
  padding:6px;
  border-radius:6px;
  background:#fafafa;
}

.student-box{
  margin-top:10px;
  padding:10px;
  border:2px dashed #999;
  border-radius:10px;
}

.line{display:inline-block;width:200px;border-bottom:1px solid #000;}

/* السؤال */
.q{
  border:1px solid #d0d7de;
  padding:10px;
  margin-top:10px;
  border-radius:12px;
}

.math{
  display:flex;
  justify-content:center;
  gap:8px;
  font-size:20px;
  margin-top:8px;
}

.answer{
  width:50px;height:32px;
  border:2px dashed #444;
  border-radius:6px;
}

@media print{
  .panel{display:none;}
  body{background:white;}
  .page{margin:0;}
}

@page{size:A4;margin:0;}

</style>
</head>

<body>

<div class="panel">

<h3>محرك منهج الرياضيات الفلسطيني</h3>

<div class="row">

<div>
<label>الصف</label>
<select id="grade">
<option value="1">الأول</option>
<option value="2">الثاني</option>
</select>
</div>

<div>
<label>الوحدة / المهارة</label>
<select id="skill">

<option value="count">العدّ</option>
<option value="compare">المقارنة</option>
<option value="order">الترتيب</option>
<option value="add">الجمع</option>
<option value="sub">الطرح</option>
<option value="word">مسائل لفظية</option>
<option value="place">القيمة المكانية</option>

</select>
</div>

<div>
<label>الحد العددي</label>
<select id="limit">
<option value="10">ضمن 10</option>
<option value="20">ضمن 20</option>
<option value="100">ضمن 100</option>
</select>
</div>

<div>
<label>عدد الأسئلة</label>
<input id="count" type="number" value="10">
</div>

</div>

<div class="row">

<div>
<label>اسم الدرس</label>
<input id="lesson" value="رياضيات">
</div>

<div>
<label>المعلم</label>
<input id="teacher" value="المعلم">
</div>

<div>
<label>المدرسة</label>
<input id="school" value="مدرسة">
</div>

<div>
<label>إجابات</label>
<select id="answers">
<option value="no">لا</option>
<option value="yes">نعم</option>
</select>
</div>

</div>

<button class="gen" onclick="build()">توليد</button>
<button class="prt" onclick="window.print()">طباعة</button>

</div>

<div id="out"></div>

<script>

/* أرقام شرقية */
function ar(n){
  return String(n).replace(/[0-9]/g,d=>
    ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][d]
  );
}

function rand(max){return Math.floor(Math.random()*(max+1));}

/* ================= محرك منهج كامل ================= */

function generate(skill,limit){

  let a,b;

  switch(skill){

    case "count":
      return {text:"عدّ الأعداد", a:rand(limit), b:""};

    case "compare":
      a=rand(limit); b=rand(limit);
      return {text:"قارن بين", a:a, b:b};

    case "order":
      return {text:"رتب الأعداد", a:rand(limit), b:rand(limit), c:rand(limit)};

    case "add":
      do{a=rand(limit); b=rand(limit);}while(a+b>limit);
      return {text:"جمع", a:a, b:b};

    case "sub":
      a=rand(limit); b=rand(a);
      return {text:"طرح", a:a, b:b};

    case "word":
      a=rand(limit); b=rand(limit);
      return {text:"مسألة لفظية", a:a, b:b};

    case "place":
      return {text:"قيمة مكانية", a:rand(limit), b:rand(limit)};

  }
}

/* ================= سؤال ================= */

function q(i,data,skill){

  if(skill=="compare"){
    return `
    <div class="q">
      <b>السؤال ${ar(i)}: قارن</b>
      <div class="math">
        <span>${ar(data.a)}</span>
        <span>___</span>
        <span>${ar(data.b)}</span>
      </div>
    </div>`;
  }

  if(skill=="add"){
    return `
    <div class="q">
      <b>السؤال ${ar(i)}</b>
      <div class="math">
        <span>${ar(data.a)}</span>
        <span>+</span>
        <span>${ar(data.b)}</span>
        <span>=</span>
        <span class="answer"></span>
      </div>
    </div>`;
  }

  if(skill=="sub"){
    return `
    <div class="q">
      <b>السؤال ${ar(i)}</b>
      <div class="math">
        <span>${ar(data.a)}</span>
        <span>-</span>
        <span>${ar(data.b)}</span>
        <span>=</span>
        <span class="answer"></span>
      </div>
    </div>`;
  }

  if(skill=="order"){
    return `
    <div class="q">
      <b>السؤال ${ar(i)}: رتب تصاعدياً</b>
      <div class="math">
        <span>${ar(data.a)}</span>
        <span>${ar(data.b)}</span>
        <span>${ar(data.c)}</span>
      </div>
    </div>`;
  }

  return `
  <div class="q">
    <b>السؤال ${ar(i)}</b>
    <div class="math">
      <span>${ar(data.a)}</span>
      <span>${ar(data.b)}</span>
    </div>
  </div>`;
}

/* ================= بناء الورقة ================= */

function build(){

  let skill=document.getElementById("skill").value;
  let limit=parseInt(document.getElementById("limit").value);
  let count=parseInt(document.getElementById("count").value);
  let lesson=document.getElementById("lesson").value;
  let teacher=document.getElementById("teacher").value;
  let school=document.getElementById("school").value;

  let html=`
  <div class="page">

    <div class="title">${lesson}</div>

    <div class="meta">
      <div>المعلم: ${teacher}</div>
      <div>المدرسة: ${school}</div>
      <div>الحد: ${ar(limit)}</div>
    </div>

    <div class="student-box">
      اسم الطالب: <span class="line"></span>
    </div>
  `;

  for(let i=1;i<=count;i++){
    let data=generate(skill,limit);
    html+=q(i,data,skill);
  }

  html+=`</div>`;

  document.getElementById("out").innerHTML=html;
}

build();

</script>

</body>
</html>
