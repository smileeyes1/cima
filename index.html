<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مولّد أوراق العمل</title>
<style>
body{font-family:Arial;margin:0;background:#eef2f6}
.app{display:flex;height:100vh}
.sidebar{width:300px;background:#0f172a;color:#fff;padding:15px}
.main{flex:1;padding:20px}
.paper{background:#fff;padding:20mm;width:210mm;min-height:297mm;margin:auto}
input,button{width:100%;padding:8px;margin:5px 0}
.btn{background:#2563eb;color:#fff;border:none}
.block{border:1px solid #ddd;padding:10px;margin:10px 0}
</style>
</head>
<body>

<div class="app">

<div class="sidebar">
<h3>مولّد أوراق العمل</h3>

<input id="lesson" placeholder="اكتب الدرس">

<button class="btn" onclick="generate()">توليد</button>
<button onclick="window.print()">طباعة</button>

</div>

<div class="main">
<div class="paper">
<h2 id="title"></h2>
<div id="content"></div>
</div>
</div>

</div>

<script>

async function generate(){

const lesson = document.getElementById("lesson").value;

document.getElementById("title").innerText = lesson;

const res = await fetch("YOUR_WORKER_URL",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({lesson})
});

const data = await res.json();

let html = "";

data.text.split("\n").forEach(line=>{
html += `<div class="block">${line}</div>`;
});

document.getElementById("content").innerHTML = html;

}

</script>

</body>
</html>
