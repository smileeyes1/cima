<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة التعلم الآمن – الجمع بالقلوب</title>

<style>
/* ===== أساس عام ===== */
*{box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:"Tajawal", Arial;
}
body{
  background:linear-gradient(#e0f7fa,#ffffff);
  color:#00695c;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ===== زر تكبير/تصغير ===== */
.full-btn{
  position:fixed;
  top:10px;
  right:10px;
  z-index:1000;
  padding:8px 14px;
  border-radius:10px;
  background:#26a69a;
  color:white;
  border:none;
  font-size:14px;
}

/* ===== الحاوية ===== */
.container{
  width:100vw;
  height:100vh;
  padding:3vh 3vw;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ===== البطاقة ===== */
.card{
  width:100%;
  height:100%;
  background:white;
  padding:20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* ===== الشخصيات ===== */
.character{
  display:flex;
  align-items:center;
  gap:10px;
}
.avatar{font-size:48px}
.name{font-size:22px;font-weight:bold}

/* ===== فقاعة الكلام ===== */
.speech{
  background:#e0f2f1;
  border-radius:16px;
  padding:14px 16px 14px 48px;
  margin:12px 0;
  position:relative;
  max-width:780px;
  text-align:center;
  font-size:18px;
}

.voice{
  position:absolute;
  left:10px;
  top:10px;
  width:30px;
  height:30px;
  border-radius:50%;
  border:none;
  background:#26a69a;
  color:white;
}

/* ===== السؤال ===== */
.question{
  font-size:36px;
  font-weight:bold;
  margin:10px 0;
}

/* ===== القلوب ===== */
.hearts{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin:6px 0;
}
.heart{
  font-size:34px;
  animation:glow 1.5s infinite alternate;
}
@keyframes glow{
  from{transform:scale(1);opacity:0.7}
  to{transform:scale(1.25);opacity:1}
}

/* ===== الإدخال والأزرار ===== */
input{
  font-size:26px;
  width:100px;
  text-align:center;
  border-radius:12px;
  border:3px solid #80cbc4;
  padding:8px;
}

button{
  margin:8px;
  padding:10px 22px;
  font-size:18px;
  border:none;
  border-radius:14px;
  background:#26a69a;
  color:white;
}

.helper{
  margin-top:10px;
  background:#fff3cd;
  color:#795548;
  border-radius:12px;
  padding:10px;
  font-size:16px;
}

@media(max-width:600px){
  .question{font-size:28px}
  .heart{font-size:28px}
  .name{font-size:18px}
}
</style>
</head>

<body>

<button class="full-btn" onclick="toggleFull()">⛶ تصغير / تكبير</button>

<div class="container">

<!-- ===== المقدمة ===== -->
<div id="intro" class="card">
  <div class="character">
    <div class="avatar">🧔🏻‍♂️</div>
    <div class="name">الحكيم إبراهيم</div>
  </div>

  <div class="speech" id="introText">
    مرحبًا بك يا بطل. هنا نتعلّم بهدوء ومحبة.
    لا خطأ هنا يُغضب، فكل محاولة عبادة، والله مع الصابرين.
  </div>
  <button class="voice" onclick="speak(introText.innerText)">🔊</button>

  <p>اسم الطالب:</p>
  <input id="student">

  <p>اسم ولي الأمر:</p>
  <input id="parent">

  <button onclick="start()">ابدأ الرحلة</button>
</div>

<!-- ===== الدرس ===== -->
<div id="lesson" class="card" style="display:none">

  <div class="character">
    <div class="avatar">👨‍🏫</div>
    <div class="name">المعلم محمد</div>
  </div>

  <div class="speech" id="teacherText"></div>
  <button class="voice" onclick="speak(teacherText.innerText)">🔊</button>

  <div class="question" id="question"></div>

  <div id="heartsA" class="hearts"></div>
  <div style="font-size:26px;font-weight:bold">+</div>
  <div id="heartsB" class="hearts"></div>
  <div id="heartsR" class="hearts"></div>

  <input id="answer" type="number" placeholder="الناتج">

  <div>
    <button onclick="check()">تحقق</button>
    <button onclick="help()">🤍 أنا محتار</button>
  </div>

  <div id="helper" class="helper" style="display:none"></div>

  <div id="nextBox" style="display:none">
    <button id="nextBtn" disabled onclick="nextQ()">التالي (١٠)</button>
  </div>

</div>
</div>

<script>
/* ===== المتغيرات ===== */
let studentName="", parentName="";
let a=0,b=0;
let streak=0;
let timer=null,sec=10;

/* ===== ملء الشاشة افتراضي ===== */
window.onload=()=>{ document.documentElement.requestFullscreen?.(); }

/* ===== تبديل ملء الشاشة ===== */
function toggleFull(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}

/* ===== الصوت العربي ===== */
function speak(text){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const v=speechSynthesis.getVoices().find(x=>x.lang.startsWith("ar"));
  if(v)u.voice=v;
  u.lang="ar-SA";
  u.rate=0.9;
  u.pitch=1.1;
  speechSynthesis.speak(u);
}

/* ===== أرقام شرقية ===== */
function eastern(n){
  return n.toString().replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
}

/* ===== القلوب ===== */
function hearts(id,n){
  const e=document.getElementById(id);
  e.innerHTML="";
  for(let i=0;i<n;i++){
    const h=document.createElement("span");
    h.className="heart";
    h.innerText="❤";
    e.appendChild(h);
  }
}

/* ===== بدء ===== */
function start(){
  studentName=student.value||"بطلنا";
  parentName=parent.value||"ولي أمره الكريم";
  intro.style.display="none";
  lesson.style.display="flex";
  newQ();
}

/* ===== سؤال جديد (تعلم متكيف) ===== */
function newQ(){
  a=streak>=3?Math.floor(Math.random()*5)+4:Math.floor(Math.random()*3)+1;
  b=Math.floor(Math.random()*3)+1;

  teacherText.innerText=
  `يا ${studentName}، سنعدّ القلوب معًا بهدوء. الجمع يعني أن نضم الأشياء، واحدًا واحدًا.`;
  speak(teacherText.innerText);

  question.innerText=`${eastern(a)} + ${eastern(b)}`;
  hearts("heartsA",a);
  hearts("heartsB",b);
  hearts("heartsR",0);

  answer.value="";
  helper.style.display="none";
  nextBox.style.display="none";
}

/* ===== تحقق ===== */
function check(){
  if(Number(answer.value)==a+b){
    streak++;
    hearts("heartsR",a+b);
    teacherText.innerText=
    `أحسنت يا ${studentName}. عملك يدل على صبر وقوة، والنبي ﷺ يحب القوي الأمين.`;
    speak(teacherText.innerText);
    startTimer();
  }else{
    streak=0;
    speak(`لا بأس يا ${studentName}. الخطأ خطوة نتعلم منها، والله معك.`);
  }
}

/* ===== مساعدة ===== */
function help(){
  helper.style.display="block";
  helper.innerText=`عدّ القلوب ببطء… واحدة… اثنتان… وتذكر أن السرعة ليست مطلوبة.`;
  speak(helper.innerText);
}

/* ===== مؤقت التالي ===== */
function startTimer(){
  sec=10;
  nextBox.style.display="block";
  nextBtn.disabled=true;
  nextBtn.innerText=`التالي (${sec})`;
  timer=setInterval(()=>{
    sec--;
    nextBtn.innerText=`التالي (${sec})`;
    if(sec<=0){
      clearInterval(timer);
      nextBtn.disabled=false;
      nextBtn.innerText="التالي";
    }
  },1000);
}

function nextQ(){ newQ(); }
</script>

</body>
</html>
