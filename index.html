<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة أوراق العمل</title>

<style>
body{
  margin:0;
  font-family:'Noto Naskh Arabic', Arial;
  background:#eef2f6;
}

.app{display:flex;height:100vh}

.sidebar{
  width:300px;
  background:#0f172a;
  color:#fff;
  padding:15px;
}

.main{flex:1;padding:15px}

input,select,textarea,button{
  width:100%;
  margin:5px 0;
  padding:8px;
  border-radius:6px;
  border:none;
  font-family:inherit;
  direction:rtl;
}

button{cursor:pointer}

.btn1{background:#22c55e;color:#fff}
.btn2{background:#2563eb;color:#fff}
.btn3{background:#334155;color:#fff}

.card{
  background:#fff;
  padding:15px;
  border-radius:10px;
}

.title{text-align:center;font-weight:bold;font-size:20px}

.stage{
  border:1px dashed #444;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}

.q{
  border:1px solid #aaa;
  padding:8px;
  min-height:40px;
  border-radius:6px;
}

.hidden{display:none}

@media print{
  .sidebar{display:none}
  .main{padding:0}
}
</style>
</head>

<body>

<div class="app">

<div class="sidebar" id="sidebar">
<h3>لوحة التحكم</h3>

<input id="lesson" placeholder="اسم الدرس">
<select id="grade">
<option value="1">الأول</option>
<option value="2">الثاني</option>
</select>

<button class="btn1" onclick="generate()">توليد ورقة</button>
<button class="btn3" onclick="toggle()">إظهار / إخفاء</button>
<button class="btn2" onclick="window.print()">طباعة</button>
</div>

<div class="main">

<div class="card">
<div class="title" id="title">---</div>
<div id="content"></div>
</div>

</div>

</div>

<script>

function toArabic(n){
return n.toString()
.replace(/0/g,'٠')
.replace(/1/g,'١')
.replace(/2/g,'٢')
.replace(/3/g,'٣')
.replace(/4/g,'٤')
.replace(/5/g,'٥')
.replace(/6/g,'٦')
.replace(/7/g,'٧')
.replace(/8/g,'٨')
.replace(/9/g,'٩');
}

function toggle(){
const sb=document.getElementById("sidebar");
sb.style.display = (sb.style.display==="none")?"block":"none";
}

function generate(){

const lesson=document.getElementById("lesson").value;

let a=Math.floor(Math.random()*10)+1;
let b=Math.floor(Math.random()*10)+1;

document.getElementById("title").innerText=lesson;

let html="";

html+=`
<div class="stage">
<div class="q">🟢 محسوس: استخدم أدوات</div>
</div>`;

html+=`
<div class="stage">
<div class="q">🟡 شبه محسوس: ${toArabic(a)} + ${toArabic(b)}</div>
</div>`;

html+=`
<div class="stage">
<div class="q">🔵 مجرد: ${toArabic(a)} + ${toArabic(b)} = ___</div>
</div>`;

html+=`
<div class="stage">
<div class="q">🟣 تطبيق: مسألة حياتية</div>
</div>`;

document.getElementById("content").innerHTML=html;

}

</script>

</body>
</html>
