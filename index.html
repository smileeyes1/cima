<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قصة العدل</title>

<style>
:root{
  --tap: 56px;
}
body{
  margin:0;
  font-family:system-ui;
  background:#fff;
}
main{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:12px;
  box-sizing:border-box;
}

.character{
  text-align:center;
  font-size:3rem;
}
.speech{
  text-align:center;
  border:2px solid #000;
  border-radius:12px;
  padding:8px;
  margin-top:6px;
}

.plates{
  display:flex;
  justify-content:space-around;
  margin:12px 0;
}
.plate{
  width:64px;
  height:64px;
  border:2px solid #000;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.8rem;
}

.apple-area{
  text-align:center;
  font-size:2.2rem;
  transition:transform .4s ease;
}

.controls{
  display:flex;
  justify-content:center;
  margin-bottom:8px;
}
button{
  min-height:var(--tap);
  padding:0 24px;
  font-size:1.1rem;
  border:2px solid #000;
  background:#fff;
}
</style>
</head>

<body>
<main>

<div>
  <div class="character">🧒</div>
  <div class="speech">هل هذا عادل؟</div>
</div>

<div class="plates">
  <div class="plate">🍽️</div>
  <div class="plate">🍽️</div>
  <div class="plate">🍽️</div>
  <div class="plate">🍽️</div>
</div>

<div class="apple-area" id="apple">🍎</div>

<div class="controls">
  <button onclick="moveApple()">ضع التفاحة</button>
</div>

</main>

<script>
let placed = 0;
function moveApple(){
  if(placed < 4){
    apple.style.transform = `translateY(-${80}px)`;
    setTimeout(()=>{
      placed++;
      apple.style.transform = 'translateY(0)';
    },400);
  }
}
</script>

</body>
</html>
