<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Engine - أوراق عمل فلسطينية</title>

<style>

/* =========================
   الأساس
========================= */

*{
  box-sizing:border-box;
  font-family:"Cairo","Tahoma",sans-serif;
}

body{
  margin:0;
  background:#eef2f1;
}

/* إجبار الطباعة */
*{
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
}

/* =========================
   لوحة التحكم
========================= */

.panel{
  position:fixed;
  right:0;
  top:0;
  width:300px;
  height:100vh;
  background:#fff;
  padding:14px;
  overflow:auto;
  box-shadow:-3px 0 10px rgba(0,0,0,0.1);
}

label{
  display:block;
  margin-top:10px;
  font-weight:bold;
  font-size:13px;
}

input,select{
  width:100%;
  padding:9px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  width:100%;
  margin-top:10px;
  padding:11px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.gen{background:#2e7d32;color:#fff;}
.prt{background:#1565c0;color:#fff;}

/* =========================
   نظام الصفحات (A4)
========================= */

.page{
  width:210mm;
  min-height:297mm;
  background:white;
  margin:10px auto;
  margin-right:320px;
  padding:8mm;
  position:relative;
  overflow:hidden;
}

/* صفحة الطباعة */
@page{
  size:A4;
  margin:0;
}

/* =========================
   الترويسة الذكية
========================= */

.header{
  border-bottom:2px solid #2e7d32;
  padding-bottom:5px;
  margin-bottom:8px;
}

.title{
  text-align:center;
  font-size:18px;
  font-weight:bold;
  color:#1b5e20;
}

.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  font-size:11px;
  margin-top:6px;
}

.meta div{
  border:1px solid #ddd;
  padding:5px;
  border-radius:6px;
  background:#fafafa;
}

/* =========================
   قياس الطباعة الذكي
========================= */

.engine{
  display:flex;
  flex-direction:column;
  gap:6px;
}

/* =========================
   السؤال
========================= */

.q{
  border:1px solid #cfd8dc;
  padding:6px;
  border-radius:8px;
  page-break-inside:avoid;
}

.qh{
  font-size:12px;
  font-weight:bold;
  color:#1565c0;
}

/* =========================
   الأشكال (ثابتة للطباعة)
========================= */

.dot{
  width:14px;
  height:14px;
  border-radius:50%;
  border:2px solid #43a047;
  display:inline-block;
  margin:2px;
}

.box{
  width:12px;
  height:12px;
  border:2px solid #90caf9;
  display:inline-block;
  margin:2px;
}

/* =========================
   معادلة
========================= */

.math{
  display:flex;
  justify-content:center;
  gap:6px;
  font-size:18px;
  margin-top:4px;
}

.answer{
  width:45px;
  height:30px;
  border:2px dashed #555;
  border-radius:6px;
}

/* =========================
   الطباعة
========================= */

@media print{

  .panel{
    display:none !important;
  }

  body{
    margin:0;
  }

  .page{
    margin:0;
    width:210mm;
    min-height:297mm;
    box-shadow:none;
  }

}

</style>
</head>

<body>

<div class="panel">

<h3>Print Engine</h3>

<label>عدد الأسئلة</label>
<input type="number" id="count" value="18">

<label>الصف</label>
<select id="grade">
<option>الأول</option>
<option selected>الثاني</option>
<option>الثالث</option>
</select>

<button class="gen" onclick="build()">توليد</button>
<button class="prt" onclick="window.print()">طباعة</button>

</div>

<div id="root"></div>

<script>

/* =========================
   أرقام شرقية
========================= */

function ar(n){
  return n.toString().replace(/[0-9]/g,d=>
    ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][d]
  );
}

/* =========================
   عشوائي
========================= */

function r(a,b){
  return Math.floor(Math.random()*(b-a+1))+a;
}

/* =========================
   سؤال
========================= */

function question(i){

  let a=r(0,10);
  let b=r(0,10-a);

  let dots1=Array(a).fill('<span class="dot"></span>').join('');
  let dots2=Array(b).fill('<span class="box"></span>').join('');

  return `
  <div class="q">

    <div class="qh">السؤال ${ar(i)}</div>

    <div>${dots1}</div>
    <div>${dots2}</div>

    <div class="math">
      <span>${ar(a)}</span>
      <span>+</span>
      <span>${ar(b)}</span>
      <span>=</span>
      <span class="answer"></span>
    </div>

  </div>
  `;
}

/* =========================
   تقسيم صفحات ذكي
========================= */

function paginate(items, perPage){

  let pages=[];

  for(let i=0;i<items.length;i+=perPage){
    pages.push(items.slice(i,i+perPage));
  }

  return pages;
}

/* =========================
   بناء النظام
========================= */

function build(){

  const count=parseInt(document.getElementById("count").value);

  let items=[];

  for(let i=1;i<=count;i++){
    items.push(question(i));
  }

  /* أهم جزء: التحكم في A4 */
  let pages=paginate(items,9);

  let html="";

  pages.forEach((p,i)=>{

    html+=`
    <div class="page">

      <div class="header">
        <div class="title">ورقة عمل تعليمية</div>

        <div class="meta">
          <div>الصف: ${document.getElementById("grade").value}</div>
          <div>نمط: تدريجي</div>
          <div>هدف: مهارة حسابية</div>
        </div>
      </div>

      <div class="engine">
        ${p.join("")}
      </div>

    </div>
    `;

  });

  document.getElementById("root").innerHTML=html;

}

build();

</script>

</body>
</html>
