<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مفهوم القسمة – صف ثاني</title>
<style>
body{
    font-family: "Tahoma", Arial, sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:0;
}
.container{
    max-width:800px;
    margin:auto;
    background:#ffffff;
    padding:٢٠px;
    border-radius:١٢px;
    margin-top:٢٠px;
}
h1{
    text-align:center;
    color:#١f٤a٨a;
}
.instructions{
    background:#e8f٠fe;
    padding:١٥px;
    border-radius:٨px;
    margin-bottom:٢٠px;
}
.activity{
    text-align:center;
}
.items{
    font-size:٣٠px;
    margin:١٠px;
}
.plates{
    display:flex;
    justify-content:space-around;
    margin-top:٢٠px;
}
.plate{
    width:١٤٠px;
    height:١٤٠px;
    border:٢px solid #١f٤a٨a;
    border-radius:١٢px;
    padding:٥px;
    background:#fafafa;
}
.plate h3{
    margin:٥px ٠;
}
.result{
    margin-top:٢٠px;
    font-size:٢٠px;
    color:#٢d٧a٢d;
    display:none;
}
button{
    margin-top:٢٠px;
    padding:١٠px ٢٠px;
    font-size:١٨px;
    background:#١f٤a٨a;
    color:white;
    border:none;
    border-radius:٨px;
    cursor:pointer;
}
button:hover{
    background:#١٧٣٨٦a;
}
</style>
</head>

<body>
<div class="container">

<h1>مفهوم القسمة</h1>

<div class="instructions">
<p><strong>هيا نتعلّم معًا:</strong></p>
<p>لدينا <strong>٨ تفّاحات</strong> ونريد توزيعها بالتساوي على <strong>٤ صحون</strong>.</p>
<p>فكّر: كم تفاحة في كل صحن؟</p>
</div>

<div class="activity">
<div class="items">
🍎 🍎 🍎 🍎 🍎 🍎 🍎 🍎
</div>

<div class="plates">
<div class="plate"><h3>صحن ١</h3><div class="content"></div></div>
<div class="plate"><h3>صحن ٢</h3><div class="content"></div></div>
<div class="plate"><h3>صحن ٣</h3><div class="content"></div></div>
<div class="plate"><h3>صحن ٤</h3><div class="content"></div></div>
</div>

<button onclick="divide()">قسّم بالتساوي</button>

<div class="result" id="result">
✨ أحسنت!  
<p>٨ ÷ ٤ = ٢</p>
<p>في كل صحن <strong>تفاحتان</strong>.</p>
</div>
</div>

</div>

<script>
function divide(){
    const plates=document.querySelectorAll('.plate .content');
    plates.forEach(p=>p.innerHTML="");

    for(let i=٠;i<plates.length;i++){
        plates[i].innerHTML="🍎 🍎";
    }

    document.getElementById("result").style.display="block";
}
</script>

</body>
</html>
