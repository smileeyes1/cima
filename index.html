<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة تحكم Gemini</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial;
    background:#0f1115;
    color:white;
}

.container{
    max-width:800px;
    margin:auto;
}

h1{
    text-align:center;
    color:#00ffd0;
}

textarea{
    width:100%;
    height:220px;
    padding:12px;
    font-size:18px;
    border:none;
    border-radius:12px;
    outline:none;
    background:#1c1f26;
    color:white;
    direction:rtl;
    text-align:right;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

button{
    flex:1;
    min-width:150px;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.send{
    background:#00ffd0;
    color:black;
}

.clear{
    background:#ef233c;
    color:white;
}

.info{
    margin-top:15px;
    text-align:center;
    opacity:0.7;
    font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<h1>لوحة تحكم Gemini</h1>

<textarea id="input" placeholder="اكتب تعليماتك أو نصك هنا..."></textarea>

<div class="buttons">

<button class="send" onclick="sendToGemini()">
إرسال إلى Gemini
</button>

<button class="clear" onclick="clearText()">
مسح
</button>

</div>

<div class="info">
سيتم نسخ النص تلقائيًا وفتح Gemini
</div>

</div>

<script>

function sendToGemini(){

    let text = document.getElementById("input").value;

    if(!text){
        alert("اكتب شيئًا أولاً");
        return;
    }

    // نسخ النص
    navigator.clipboard.writeText(text);

    // فتح Gemini
    window.open("https://gemini.google.com", "_blank");
}

function clearText(){
    document.getElementById("input").value = "";
}

</script>

</body>
</html>
