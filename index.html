<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تجربة سامر</title>
<style>
body{
  margin:0;font-family:system-ui, sans-serif;background:#f7f7f7;
  display:flex;flex-direction:column;height:100vh;touch-action:manipulation;
}
#top{padding:١rem;text-align:center;font-size:١.٢rem;}
#middle{
  flex:١;display:flex;justify-content:center;align-items:center;
}
.container{
  width:٨٠%;height:٦٠%;border:٤px solid #999;border-radius:١rem;
  display:flex;justify-content:space-around;align-items:flex-end;padding:١rem;
}
.box{
  width:٣٠%;height:١٠٠%;border:٣px dashed #bbb;border-radius:٠.٥rem;
  display:flex;justify-content:center;align-items:flex-end;
}
.balls{display:flex;flex-wrap:wrap;gap:٠.٣rem;padding:٠.٥rem;}
.ball{width:١.٢rem;height:١.٢rem;border-radius:٥٠%;background:#4caf50;}
#bottom{padding:١rem;}
button{
  width:١٠٠%;padding:٠.٨rem;font-size:١.١rem;
  border:none;border-radius:٠.٨rem;background:#1976d2;color:white;
}
.hidden{display:none;}
</style>
</head>
<body>

<div id="top">سامر يرتب كراته في علب متشابهة</div>

<div id="middle">
  <div class="container">
    <div class="box"><div class="balls" id="b١">
      <div class="ball"></div><div class="ball"></div><div class="ball"></div>
    </div></div>
    <div class="box"><div class="balls" id="b٢">
      <div class="ball"></div>
    </div></div>
    <div class="box"><div class="balls" id="b٣"></div></div>
  </div>
</div>

<div id="bottom">
  <button id="action">رَتِّب</button>
</div>

<script>
let state = ٠;
const action = document.getElementById("action");
action.addEventListener("click", ()=>{
  if(state===٠){
    // STATE ١ -> ٤ مباشرة عبر تصحيح تلقائي (Error‑Proof)
    const all = document.querySelectorAll(".ball");
    document.getElementById("b١").innerHTML="";
    document.getElementById("b٢").innerHTML="";
    document.getElementById("b٣").innerHTML="";
    all.forEach((b,i)=>{
      if(i%٣===٠)document.getElementById("b١").appendChild(b);
      if(i%٣===١)document.getElementById("b٢").appendChild(b);
      if(i%٣===٢)document.getElementById("b٣").appendChild(b);
    });
    state=٥;
    action.textContent="انتهى";
    document.getElementById("top").textContent="هذه مجموعات متساوية";
  }else{
    // STATE ٦ Termination
    document.body.innerHTML="<div style='margin:auto;font-size:١.٣rem'>انتهت التجربة</div>";
  }
});
</script>

</body>
</html>
