<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حقائق الضرب للعدد ١٠</title>

<style>
:root{
  --tap: 56px;
  --step: 40px;
}
body{
  margin:0;
  font-family: system-ui;
  background:#ffffff;
}
main{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:12px;
  box-sizing:border-box;
}

/* STORY ZONE */
.story-zone{
  text-align:center;
}
.character{
  width:72px;
  height:72px;
  margin:0 auto;
  border-radius:50%;
  background:#f1d2b6;
  position:relative;
}
.character:before,
.character:after{
  content:"";
  position:absolute;
  top:22px;
  width:10px;
  height:10px;
  background:#000;
  border-radius:50%;
}
.character:before{left:18px;}
.character:after{right:18px;}
.mouth{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  width:28px;
  height:10px;
  border-bottom:3px solid #000;
  border-radius:0 0 30px 30px;
}
.story-text{
  margin-top:8px;
  padding:8px;
  border:2px solid #000;
  border-radius:12px;
  font-size:1.1rem;
}

/* ACTION ZONE */
.action-zone{
  flex-grow:1;
  display:flex;
  align-items:center;
  justify-content:center;
}
.path{
  display:flex;
  gap:6px;
}
.step{
  width:var(--step);
  height:var(--step);
  border:2px solid #000;
  border-radius:50%;
  opacity:0;
  transition:opacity .4s ease;
}

/* CONTROL ZONE */
.control-zone{
  display:flex;
  justify-content:center;
}
button{
  min-height:var(--tap);
  padding:0 28px;
  border:3px solid #000;
  background:#fff;
  font-size:1.1rem;
}
button:disabled{
  opacity:.5;
}
</style>
</head>

<body>
<main>

<!-- STORY ZONE -->
<div class="story-zone">
  <div class="character">
    <div class="mouth"></div>
  </div>
  <div class="story-text" id="story">أمشي عشر خطوات كل مرة.</div>
</div>

<!-- ACTION ZONE -->
<div class="action-zone">
  <div class="path" id="path"></div>
</div>

<!-- CONTROL ZONE -->
<div class="control-zone">
  <button id="btn" onclick="next()">امشِ مرة أخرى</button>
</div>

</main>

<script>
const path = document.getElementById("path");
const story = document.getElementById("story");
const btn = document.getElementById("btn");

let state = 0;
let groups = 0;

// prepare empty steps
function showSteps(){
  for(let i=0;i<10;i++){
    const s = document.createElement("div");
    s.className = "step";
    path.appendChild(s);
    setTimeout(()=>{s.style.opacity = 1;}, i*80);
  }
}

// clear path
function clearPath(){
  path.innerHTML = "";
}

function next(){
  // STATE ١-٣: مشي متكرر
  if(state >=1 && state <=3){
    showSteps();
    groups++;
    state++;
    return;
  }

  if(state === 0){
    state = 1;
    showSteps();
    return;
  }

  // STATE ٤: الحكم
  if(state === 4){
    story.textContent = "كل مرة عشر.";
    btn.disabled = true;
    setTimeout(()=>{
      story.textContent = "١٠ × ٣ = ٣٠";
    }, 800);
    state = 5;
    return;
  }
}

// transition handling
// after each group, prepare next
path.addEventListener("transitionend", ()=>{
  clearPath();
  if(groups === 1) state = 2;
  if(groups === 2) state = 3;
  if(groups === 3) state = 4;
});
</script>

</body>
</html>
