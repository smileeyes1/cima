<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام أوراق العمل التربوي المتقدم</title>

<style>

/* =========================
   الأساس
========================= */

*{
    box-sizing:border-box;
    font-family:"Cairo","Tahoma",sans-serif;
}

body{
    margin:0;
    background:#eef3f1;
}

/* إجبار الطباعة */
*{
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
}

/* =========================
   لوحة التحكم (لا تُطبع أبداً)
========================= */

.panel{
    position:fixed;
    right:0;
    top:0;
    width:320px;
    height:100vh;
    background:#ffffff;
    padding:16px;
    overflow:auto;
    box-shadow:-4px 0 15px rgba(0,0,0,0.12);
}

.panel h2{
    margin-top:0;
    color:#1b5e20;
    font-size:18px;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
    font-size:13px;
    color:#333;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:14px;
}

button{
    width:100%;
    margin-top:12px;
    padding:12px;
    border:none;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
}

.btn-gen{background:#2e7d32;color:#fff;}
.btn-print{background:#1565c0;color:#fff;}

/* =========================
   صفحة A4
========================= */

.page{
    width:210mm;
    min-height:297mm;
    background:white;
    margin:10px auto;
    margin-right:340px;
    padding:10mm;
    position:relative;
    overflow:hidden;
}

/* إطار بصري خفيف */
.page::before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    background:rgba(46,125,50,0.06);
    border-radius:50%;
    top:-60px;
    left:-60px;
}

.page::after{
    content:"";
    position:absolute;
    width:200px;
    height:200px;
    background:rgba(21,101,192,0.06);
    border-radius:50%;
    bottom:-70px;
    right:-70px;
}

/* =========================
   الترويسة (احترافية ومضغوطة)
========================= */

.header{
    border-bottom:2px solid #2e7d32;
    padding-bottom:6px;
    margin-bottom:10px;
}

.title{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#1b5e20;
}

.meta{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-top:8px;
    font-size:11px;
}

.meta div{
    border:1px solid #ddd;
    background:#fafafa;
    padding:6px;
    border-radius:8px;
}

/* =========================
   عنوان القسم
========================= */

.section{
    background:linear-gradient(135deg,#2e7d32,#43a047);
    color:white;
    padding:8px 12px;
    border-radius:10px;
    margin:10px 0;
    font-size:14px;
    font-weight:bold;
}

/* =========================
   السؤال
========================= */

.q{
    border:1px solid #cfd8dc;
    border-radius:10px;
    padding:8px;
    margin-bottom:8px;
    page-break-inside:avoid;
}

.qn{
    font-size:12px;
    font-weight:bold;
    color:#1565c0;
    margin-bottom:6px;
}

/* =========================
   التدرج التربوي
========================= */

/* محسوس */
.dot{
    width:14px;
    height:14px;
    border-radius:50%;
    border:2px solid #43a047;
    display:inline-block;
    margin:2px;
}

/* شبه محسوس */
.box{
    width:12px;
    height:12px;
    border:2px solid #90caf9;
    display:inline-block;
    margin:2px;
}

/* =========================
   المعادلة
========================= */

.math{
    display:flex;
    justify-content:center;
    gap:6px;
    font-size:18px;
    margin-top:6px;
}

.answer{
    width:45px;
    height:32px;
    border:2px dashed #555;
    border-radius:6px;
}

/* =========================
   الطباعة (فصل كامل)
========================= */

@media print{

    .panel{
        display:none !important;
    }

    body{
        margin:0;
    }

    .page{
        margin:0;
        width:210mm;
        min-height:297mm;
        box-shadow:none;
    }
}

/* تثبيت الطباعة */
@page{
    size:A4;
    margin:0;
}

</style>
</head>

<body>

<!-- =========================
     لوحة التحكم (لا تُطبع)
========================= -->

<div class="panel">

<h2>لوحة التحكم</h2>

<label>اسم الدرس</label>
<input type="text" id="lesson" value="الجمع ضمن ١٠">

<label>الصف</label>
<select id="grade">
<option>الأول</option>
<option selected>الثاني</option>
<option>الثالث</option>
</select>

<label>اسم المعلم</label>
<input type="text" id="teacher" value="الأستاذ محمد">

<label>عدد الأسئلة</label>
<input type="number" id="count" value="12" min="4" max="20">

<button class="btn-gen" onclick="generate()">توليد الورقة</button>
<button class="btn-print" onclick="window.print()">طباعة</button>

</div>

<!-- =========================
     صفحة الطباعة
========================= -->

<div id="out"></div>

<script>

/* =========================
   أرقام شرقية
========================= */

function ar(n){
    return n.toString().replace(/[0-9]/g,d=>
        ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][d]
    );
}

/* =========================
   عشوائي
========================= */

function r(a,b){
    return Math.floor(Math.random()*(b-a+1))+a;
}

/* =========================
   سؤال متدرج
========================= */

function question(i){

    let a=r(0,10);
    let b=r(0,10-a);

    let dotsA=Array(a).fill('<span class="dot"></span>').join('');
    let dotsB=Array(b).fill('<span class="box"></span>').join('');

    return `
    <div class="q">

        <div class="qn">السؤال ${ar(i)}</div>

        <div>${dotsA}</div>
        <div>${dotsB}</div>

        <div class="math">
            <span>${ar(a)}</span>
            <span>+</span>
            <span>${ar(b)}</span>
            <span>=</span>
            <span class="answer"></span>
        </div>

    </div>
    `;
}

/* =========================
   توليد الورقة
========================= */

function generate(){

    const count=parseInt(document.getElementById("count").value);
    const grade=document.getElementById("grade").value;
    const lesson=document.getElementById("lesson").value;
    const teacher=document.getElementById("teacher").value;

    let html="";

    html+=`
    <div class="page">

        <div class="header">

            <div class="title">
                ${lesson}
            </div>

            <div class="meta">

                <div>الصف: ${grade}</div>
                <div>المعلم: ${teacher}</div>
                <div>الزمن: 40 دقيقة</div>

            </div>

        </div>

        <div class="section">
            تدرج تعليمي: محسوس → شبه محسوس → مجرد
        </div>
    `;

    for(let i=1;i<=count;i++){
        html+=question(i);
    }

    html+=`</div>`;

    document.getElementById("out").innerHTML=html;
}

generate();

</script>

</body>
</html>
