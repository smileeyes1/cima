<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ورقة عمل الرياضيات الذكية المطورة</title>

<style>
:root{
  --primary:#1a73e8;
  --bg:#f4f6fb;
  --border:#e0e3e7;
  --soft:#eef2f7;
}

*{
  box-sizing:border-box;
  font-family:"Cairo","Tahoma",sans-serif;
}

body{
  margin:0;
  background:var(--bg);
}

/* لوحة التحكم */
.panel{
  background:#fff;
  padding:15px;
  border-bottom:1px solid var(--border);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
  gap:10px;
}

input,select{
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  font-size:14px;
}

button{
  padding:10px 20px;
  border:none;
  border-radius:8px;
  background:var(--primary);
  color:white;
  cursor:pointer;
  font-weight:bold;
}

button.print-btn {
  background:#202124;
}

/* الصفحة */
.page{
  width:210mm;
  min-height:297mm;
  background:#fff;
  margin:15px auto;
  padding:15mm;
  box-shadow: 0 0 10px rgba(0,0,0,0.05);
}

.header{text-align:center; margin-bottom: 15px;}
.title{
  font-size:26px;
  font-weight:bold;
  color:#1a73e8;
}

.goal{
  font-size:13px;
  color:#555;
  margin-top:5px;
}

.meta{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:10px;
}

.meta div{
  background:var(--soft);
  padding:8px;
  font-size:13px;
  border-radius:6px;
  text-align:center;
}

.student{
  margin-top:10px;
  padding:12px;
  background:var(--soft);
  border-radius:8px;
  font-weight:bold;
}

.q{
  margin-top:15px;
  padding:15px;
  border:1px solid var(--border);
  border-radius:12px;
  page-break-inside: avoid;
  break-inside: avoid;
}

.inst{
  font-size:14px;
  color:#333;
  font-weight:bold;
  margin-bottom:8px;
}

.level{
  text-align:center;
  margin-top:8px;
  font-size:20px;
  letter-spacing: 2px;
}

.box{
  display:inline-block;
  width:70px;
  height:35px;
  border:2px dashed #666;
  border-radius:8px;
  margin:2px;
  vertical-align: middle;
}

@media print{
  .panel{display:none}
  body{background:#fff}
  .page{margin:0; padding:10mm; box-shadow:none; width:100%;}
}
</style>
</head>

<body>

<div class="panel">
<div class="grid">
<input id="student" placeholder="اسم الطالب">
<input id="value-theme" placeholder="قيمة الأسبوع (مثال: بر الوالدين)">

<select id="grade">
<option value="1">الصف الأول</option>
<option value="2">الصف الثاني</option>
</select>

<select id="level">
<option value="easy">سهل</option>
<option value="mid">متوسط</option>
<option value="hard">متقدم</option>
</select>

<select id="skill">
<option value="mix">مهارات مختلطة</option>
<option value="add">جمع</option>
<option value="sub">طرح</option>
<option value="compare">مقارنة</option>
<option value="order">ترتيب الأعداد</option>
<option value="count">عد العناصر</option>
</select>

<input id="count" type="number" value="10" min="1" max="25" title="عدد الأسئلة">
</div>

<br>
<button onclick="build()">توليد ورقة العمل</button>
<button class="print-btn" onclick="window.print()">طباعة</button>
</div>

<div id="out"></div>

<script>

/* تحويل آمن للأرقام إلى العربية */
function ar(n){
  return String(n).replace(/[0-9]/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
}

/* منع الثغرات وتطهير النصوص */
function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

const rand = max => Math.floor(Math.random() * (max + 1));

/* التمثيل البصري للمحسوسات - مجموعات خماسية متباعدة لسهولة العد */
function show(n){
  if(n === 0) return "—";
  let dots = "";
  for(let i = 1; i <= n; i++){
    dots += "● ";
    if(i % 5 === 0 && i !== n) dots += "&nbsp;&nbsp;&nbsp;";
  }
  return dots;
}

/* حدود الأرقام حسب الصف والمستوى */
function limit(level, grade){
  if(grade === "1") {
    if(level === "easy") return 5;
    if(level === "mid") return 10;
    return 15;
  } else {
    if(level === "easy") return 10;
    if(level === "mid") return 20;
    return 30;
  }
}

/* بنك التعليمات */
function inst(type){
  const map={
    add:["اجمع الأعداد التالية:", "عد العناصر ثم اكتب ناتج الجمع:"],
    sub:["احسب ناتج الطرح:", "أوجد الفرق بين العددين:"],
    compare:["ضع الإشارة المناسبة ( > ، < ، = ) داخل المربع:"],
    order:["رتب الأعداد التالية من الأصغر إلى الأكبر:"],
    count:["عد العناصر واكتب العدد الصحيح:"]
  };
  let arr = map[type] || ["أجب عن السؤال التالي:"];
  return arr[rand(arr.length - 1)];
}

/* توليد الأسئلة بذكاء وأمان */
function gen(skill, lim){
  if(skill === "mix"){
    const arr=["add","sub","compare","order","count"];
    skill = arr[rand(arr.length-1)];
  }

  if(skill === "add"){
    let a = rand(lim);
    let b = rand(lim - a);
    return {type:"add", a, b};
  }

  if(skill === "sub"){
    let a = rand(lim);
    let b = rand(a);
    return {type:"sub", a, b};
  }

  if(skill === "compare"){
    let a = rand(lim);
    let b = rand(lim);
    return {type:"compare", a, b};
  }

  if(skill === "order"){
    let nums = new Set();
    let safeLim = Math.max(lim, 6); 
    while(nums.size < 3){
      nums.add(rand(safeLim));
    }
    return {type:"order", nums:[...nums]};
  }

  if(skill === "count"){
    return {type:"count", a:Math.max(1, rand(lim))};
  }

  return {type:"count", a:1};
}

/* بناء وتصميم هيكل السؤال */
function draw(d, i){
 let h = `<div class="q">
 <div><b>السؤال ${ar(i)}:</b></div>
 <div class="inst">${inst(d.type)}</div>`;

 if(d.type==="add"){
  h+=`<div class="level" style="color:#666; font-size:16px;" dir="ltr">${show(d.a)} &nbsp;&nbsp;+&nbsp;&nbsp; ${show(d.b)}</div>
  <div class="level">${ar(d.a)} + ${ar(d.b)} = <span class="box"></span></div>`;
 }

 if(d.type==="sub"){
  h+=`<div class="level" style="color:#666; font-size:16px;" dir="ltr">${show(d.a)} &nbsp;&nbsp;−&nbsp;&nbsp; ${show(d.b)}</div>
  <div class="level">${ar(d.a)} − ${ar(d.b)} = <span class="box"></span></div>`;
 }

 if(d.type==="compare"){
  h+=`<div class="level">${ar(d.a)} &nbsp; <span class="box"></span> &nbsp; ${ar(d.b)}</div>`;
 }

 if(d.type==="order"){
  h+=`<div class="level" style="letter-spacing:8px;">${d.nums.map(ar).join(" ، ")}</div>
  <div class="level" style="margin-top:12px;">
    <span class="box"></span> &nbsp;ثم&nbsp; <span class="box"></span> &nbsp;ثم&nbsp; <span class="box"></span>
  </div>`;
 }

 if(d.type==="count"){
  h+=`<div class="level" style="margin-bottom:10px;" dir="ltr">${show(d.a)}</div>
  <div class="level">العدد: <span class="box"></span></div>`;
 }

 return h + "</div>";
}

/* إنشاء الصفحة وتعبئة البيانات */
function build(){
 let student = escapeHtml(document.getElementById("student").value || "_____________________");
 let valueTheme = escapeHtml(document.getElementById("value-theme").value || "طلب العلم والعمل الصالح");
 let grade = document.getElementById("grade").value;
 let level = document.getElementById("level").value;
 let skill = document.getElementById("skill").value;
 let count = Math.min(25, Math.max(1, parseInt(document.getElementById("count").value || 10)));

 let lim = limit(level, grade);
 
 const gradeAr = grade === "1" ? "الأول" : "الثاني";
 const levelAr = {"easy":"سهل", "mid":"متوسط", "hard":"متقدم"}[level];

 let html = `
 <div class="page">

 <div class="header">
 <div class="title">ورقة عمل الرياضيات الذكية</div>
 <div class="goal">التدرج التربوي: محسوس ← بصري ← مجرد</div>
 </div>

 <div class="meta">
 <div>المعلم: ______________</div>
 <div>المدرسة: ______________</div>
 <div>التاريخ: ___ / ___ / ١٤٤٧هـ</div>
 <div>قيمة الأسبوع: ${valueTheme}</div>
 </div>

 <div class="student">اسم الطالب/ة: ${student}</div>

 <div style="text-align:center; margin-top:10px; font-weight:bold; color:#555;">
 الصف: ${gradeAr} &nbsp;|&nbsp; مستوى التحدي: ${levelAr}
 </div>
 <hr style="border:0; border-top:1px dashed var(--border); margin-top:15px;">
 `;

 for(let i=1; i<=count; i++){
   html += draw(gen(skill, lim), i);
 }

 html += "</div>";
 document.getElementById("out").innerHTML = html;
}

// بناء أولي عند تحميل الصفحة
build();

</script>

</body>
</html>
