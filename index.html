<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محرك أوراق العمل الذكي</title>

<style>

*{
  box-sizing:border-box;
  font-family:"Cairo","Tahoma",sans-serif;
}

body{
  margin:0;
  background:#eef2f3;
}

/* ================= لوحة التحكم ================= */

.panel{
  background:white;
  padding:15px;
  border-bottom:3px solid #2e7d32;
}

.row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

label{
  font-size:12px;
  font-weight:bold;
  margin-top:6px;
  display:block;
}

input,select{
  width:100%;
  padding:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.gen{background:#2e7d32;color:white;}
.prt{background:#1565c0;color:white;}

/* ================= الصفحة ================= */

.page{
  width:210mm;
  min-height:297mm;
  background:white;
  margin:15px auto;
  padding:12mm;
}

.title{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  color:#1b5e20;
}

.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  font-size:11px;
  margin-top:10px;
}

.meta div{
  border:1px solid #ddd;
  padding:6px;
  border-radius:6px;
  background:#fafafa;
}

/* اسم الطالب */
.student-box{
  margin-top:10px;
  padding:10px;
  border:2px dashed #999;
  border-radius:10px;
}

.line{
  display:inline-block;
  width:200px;
  border-bottom:1px solid #000;
}

/* الهدف */
.objectives{
  margin-top:10px;
  padding:8px;
  background:#f1f8e9;
  border-right:4px solid #43a047;
  font-size:12px;
}

/* السؤال */
.q{
  border:1px solid #d0d7de;
  padding:10px;
  margin-top:10px;
  border-radius:12px;
}

.emoji{
  font-size:18px;
  margin:2px;
}

.math{
  display:flex;
  justify-content:center;
  gap:8px;
  font-size:20px;
  margin-top:8px;
}

.answer{
  width:50px;
  height:32px;
  border:2px dashed #444;
  border-radius:6px;
}

/* طباعة */
@media print{
  .panel{display:none;}
  body{background:white;}
  .page{margin:0;}
}

@page{
  size:A4;
  margin:0;
}

</style>
</head>

<body>

<!-- لوحة التحكم -->
<div class="panel">

<h3>محرك أوراق العمل الذكي</h3>

<div class="row">

<div>
<label>الصف</label>
<select id="grade">
<option value="1">الأول</option>
<option value="2" selected>الثاني</option>
</select>
</div>

<div>
<label>نوع الدرس</label>
<select id="type">
<option value="add">الجمع</option>
<option value="sub">الطرح</option>
<option value="mix">مختلط</option>
</select>
</div>

<div>
<label>الحد العددي</label>
<select id="limit">
<option value="10" selected>ضمن 10</option>
<option value="20">ضمن 20</option>
<option value="30">ضمن 30</option>
</select>
</div>

<div>
<label>عدد الأسئلة</label>
<input id="count" type="number" value="10">
</div>

</div>

<div class="row">

<div>
<label>اسم الدرس الكامل</label>
<input id="lesson" value="الجمع والطرح ضمن العدد 10">
</div>

<div>
<label>اسم المعلم</label>
<input id="teacher" value="المعلم">
</div>

<div>
<label>المدرسة</label>
<input id="school" value="مدرسة">
</div>

<div>
<label>إظهار الإجابات</label>
<select id="answers">
<option value="no">لا</option>
<option value="yes">نعم</option>
</select>
</div>

</div>

<button class="gen" onclick="build()">توليد الورقة</button>
<button class="prt" onclick="window.print()">طباعة</button>

</div>

<div id="out"></div>

<script>

/* ================= أرقام شرقية ================= */

function ar(n){
  return String(n).replace(/[0-9]/g,d=>
    ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][d]
  );
}

/* ================= رموز ================= */

function emojis(){
  return ["🍎","🍌","⭐","📘","🟢"];
}

/* ================= محرك القيود ================= */

function rand(max){
  return Math.floor(Math.random()*(max+1));
}

function generatePair(limit,type){

  let a,b;

  if(type==="add"){

    do{
      a = rand(limit);
      b = rand(limit);
    }while(a + b > limit);

  }

  else if(type==="sub"){

    a = rand(limit);
    b = rand(a);

  }

  else if(type==="mix"){

    if(Math.random()>0.5){

      do{
        a = rand(limit);
        b = rand(limit);
      }while(a + b > limit);

    }else{
      a = rand(limit);
      b = rand(a);
    }
  }

  return {a,b};
}

/* ================= سؤال ================= */

function question(i,a,b,type,em,showAns){

  let op = type==="sub" ? "-" : "+";
  let res = type==="sub" ? (a-b) : (a+b);

  let icons = Array(Math.min(a,5))
    .fill(`<span class="emoji">${em}</span>`)
    .join('');

  return `
  <div class="q">

    <b>السؤال ${ar(i)}</b>

    <div style="text-align:center;margin-top:6px">
      ${icons}
    </div>

    <div class="math">
      <span>${ar(a)}</span>
      <span>${op}</span>
      <span>${ar(b)}</span>
      <span>=</span>
      <span class="answer"></span>
      ${showAns ? `<span style="font-size:12px;color:green">(${ar(res)})</span>` : ""}
    </div>

  </div>`;
}

/* ================= بناء الورقة ================= */

function build(){

  let limit = parseInt(document.getElementById("limit").value);
  let type = document.getElementById("type").value;
  let count = parseInt(document.getElementById("count").value);
  let teacher = document.getElementById("teacher").value;
  let school = document.getElementById("school").value;
  let lesson = document.getElementById("lesson").value;
  let showAns = document.getElementById("answers").value==="yes";

  let em = emojis();

  let html=`
  <div class="page">

    <div class="title">${lesson}</div>

    <div class="meta">
      <div>المعلم: ${teacher}</div>
      <div>المدرسة: ${school}</div>
      <div>الحد العددي: ${ar(limit)}</div>
    </div>

    <div class="student-box">
      اسم الطالب: <span class="line"></span>
    </div>

    <div class="objectives">
      الهدف: تنمية مهارات الحساب ضمن المجال العددي المحدد مع التدرج والفهم.
    </div>
  `;

  for(let i=1;i<=count;i++){

    let pair = generatePair(limit,type);

    html += question(
      i,
      pair.a,
      pair.b,
      type,
      em[i%em.length],
      showAns
    );
  }

  html += `</div>`;

  document.getElementById("out").innerHTML = html;
}

build();

</script>

</body>
</html>
