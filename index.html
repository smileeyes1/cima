<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قِصّة العدل — القسمة</title>
<style>
html,body{margin:0;font-family:system-ui;background:#fff;color:#111}
main{max-width:٤٢٠px;margin:auto;padding:١٦px;text-align:center}
.character{font-size:٤rem;margin:٤px ٠}
.speech{border:٢px solid #000;border-radius:٨px;padding:٨px;margin:٨px ٠}
.plates{display:flex;justify-content:center;gap:١٢px;margin:١٦px ٠}
.plate{
  width:٧٢px;height:٧٢px;border:٢px solid #000;border-radius:١٠٠%;
  display:flex;align-items:center;justify-content:center;font-size:٢rem
}
.food{font-size:٢rem;margin:٨px ٠}
button{width:١٠٠%;padding:١٢px;font-size:١rem;border:٢px solid #000;background:#fff}
.notice{font-size:١.٤rem;margin-top:١٢px}
.hidden{display:none}
</style>
</head>
<body>
<main>

<div class="character">🧒</div>
<div class="speech">هل هذا عادل؟</div>

<div class="plates">
  <div class="plate" id="p١">🍽️</div>
  <div class="plate" id="p٢">🍽️</div>
  <div class="plate" id="p٣">🍽️</div>
  <div class="plate" id="p٤">🍽️</div>
</div>

<div class="food">🍎 🍎 🍎 🍎 🍎 🍎 🍎 🍎</div>

<button onclick="deal()">وزّع</button>

<div class="notice hidden" id="ok">✅ عادل</div>

<script>
let step=٠;
function reset(){
  p١.textContent='🍽️'; p٢.textContent='🍽️';
  p٣.textContent='🍽️'; p٤.textContent='🍽️';
}
function deal(){
  reset(); step++;
  // توزيع غير عادل
  if(step===١){p١.textContent='🍽️🍎🍎🍎'; p٢.textContent='🍽️🍎';}
  // محاولة
  if(step===٢){p١.textContent='🍽️🍎🍎'; p٢.textContent='🍽️🍎🍎';}
  // عدل
  if(step===٣){
    p١.textContent='🍽️🍎🍎'; p٢.textContent='🍽️🍎🍎';
    p٣.textContent='🍽️🍎🍎'; p٤.textContent='🍽️🍎🍎';
    document.getElementById('ok').classList.remove('hidden');
  }
}
</script>

</main>
</body>
</html>
