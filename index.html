<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام أوراق العمل المطوّر</title>

<style>

:root{
  --primary:#1a73e8;
  --bg:#f6f8fc;
  --border:#e0e3e7;
  --soft:#f1f3f4;
  --text:#1f1f1f;
  --muted:#5f6368;
}

*{
  box-sizing:border-box;
  font-family:"Cairo","Tahoma",sans-serif;
}

body{
  margin:0;
  background:var(--bg);
}

/* ===== لوحة التحكم ===== */

.panel{
  background:white;
  padding:16px;
  border-bottom:1px solid var(--border);
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

label{
  font-size:11px;
  color:var(--muted);
}

input,select{
  width:100%;
  padding:9px;
  border:1px solid var(--border);
  border-radius:10px;
}

/* ===== الصفحة ===== */

.page{
  width:210mm;
  min-height:297mm;
  margin:20px auto;
  background:white;
  padding:16mm;
}

/* ===== السؤال ===== */

.q{
  margin-top:14px;
  padding:14px;
  border:1px solid var(--border);
  border-radius:12px;
}

.title{
  text-align:center;
  font-size:22px;
  font-weight:600;
}

.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.meta div{
  background:var(--soft);
  padding:8px;
  border-radius:10px;
  font-size:11px;
}

.student{
  margin-top:10px;
  padding:10px;
  background:var(--soft);
  border-radius:10px;
}

.qh{
  font-weight:600;
  color:var(--primary);
}

.step{
  font-size:11px;
  color:var(--muted);
}

.visual{
  text-align:center;
  font-size:18px;
  margin:10px 0;
}

.math{
  display:flex;
  justify-content:center;
  gap:10px;
  font-size:22px;
}

.box{
  width:60px;
  height:36px;
  border:2px dashed #666;
  border-radius:8px;
}

/* ===== الطباعة ===== */

@media print{
  .panel{display:none;}
  body{background:white;}
  .page{margin:0;border:none;}
}

@page{
  size:A4;
  margin:12mm;
}

</style>
</head>

<body>

<!-- ================= لوحة التحكم ================= -->

<div class="panel">

<h3>نظام أوراق العمل المطوّر</h3>

<div class="grid">

<div>
<label>المهارة</label>
<select id="skill">
<option value="mix">مختلط</option>
<option value="add">جمع</option>
<option value="sub">طرح</option>
<option value="compare">مقارنة</option>
<option value="order">ترتيب</option>
<option value="count">عد</option>
</select>
</div>

<div>
<label>المستوى</label>
<select id="level">
<option value="1">محسوس</option>
<option value="2">بصري</option>
<option value="3">مجرد</option>
</select>
</div>

<div>
<label>الحد</label>
<select id="limit">
<option value="10">10</option>
<option value="20">20</option>
</select>
</div>

<div>
<label>عدد الأسئلة</label>
<input id="count" type="number" value="10">
</div>

</div>

<button onclick="build()">توليد</button>

</div>

<div id="out"></div>

<script>

/* ================= أرقام عربية ================= */

function ar(n){
  return String(n).replace(/[0-9]/g,d=>
    ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][d]
  );
}

/* ================= rand (إصلاح منع الصفر) ================= */

function rand(max,allowZero=true){
  let n=Math.floor(Math.random()*(max+1));
  if(!allowZero && n===0) return 1;
  return n;
}

/* ================= منع التكرار ================= */

let used=new Set();

function norm(a,b){
  return a>b ? `${b}-${a}` : `${a}-${b}`;
}

/* ================= توليد ================= */

function generate(skill,limit){

  if(skill==="mix"){
    let pool=["add","sub","compare","order","count"];
    skill=pool[rand(pool.length-1)];
  }

  if(skill==="add"){
    let a,b;
    do{
      a=rand(limit,false);
      b=rand(limit,false);
    }while(a+b>limit);
    return {type:"add",a,b};
  }

  if(skill==="sub"){
    let a=rand(limit,false);
    let b=rand(a,false);
    return {type:"sub",a,b};
  }

  if(skill==="compare"){
    let a=rand(limit,false);
    let b=rand(limit,false);

    if(a===b) b=Math.min(limit,b+1);

    return {type:"compare",a,b};
  }

  if(skill==="order"){
    let a=rand(limit),b=rand(limit),c=rand(limit);
    while(a===b||a===c||b===c){
      a=rand(limit);b=rand(limit);c=rand(limit);
    }
    return {type:"order",a,b,c};
  }

  if(skill==="count"){
    return {type:"count",a:rand(limit)};
  }
}

/* ================= منع التكرار الحقيقي ================= */

function isDup(d){

  if(d.type==="add"){
    let k=norm(d.a,d.b);
    if(used.has("a:"+k)) return true;
    used.add("a:"+k);
  }

  if(d.type==="sub"){
    let k=`${d.a}-${d.b}`;
    if(used.has("s:"+k)) return true;
    used.add("s:"+k);
  }

  if(d.type==="compare"){
    let k=norm(d.a,d.b);
    if(used.has("c:"+k)) return true;
    used.add("c:"+k);
  }

  if(d.type==="order"){
    let k=[d.a,d.b,d.c].sort().join(",");
    if(used.has("o:"+k)) return true;
    used.add("o:"+k);
  }

  if(d.type==="count"){
    let k=d.a;
    if(used.has("n:"+k)) return true;
    used.add("n:"+k);
  }

  return false;
}

/* ================= التدرج ================= */

function step(l){
  return l==1?"محسوس":l==2?"بصري":"مجرد";
}

/* ================= تمثيل بصري محسّن ================= */

function repeat(icon,n){
  return icon.repeat(Math.min(n,15));
}

function visual(d,level){

  if(level==1){
    if(d.type==="count") return repeat("🍎 ",d.a);
    if(d.type==="add") return repeat("🍎 ",d.a)+" + "+repeat("🍌 ",d.b);
    if(d.type==="sub") return repeat("🍎 ",d.a)+" - "+repeat("🍎 ",d.b);
  }

  if(level==2){
    if(d.type==="count") return repeat("⭐ ",d.a);
    if(d.type==="add") return `🍎 ${d.a} + 🍌 ${d.b}`;
    if(d.type==="sub") return `🍎 ${d.a} - 🍌 ${d.b}`;
  }

  return "";
}

/* ================= عرض السؤال ================= */

function render(d,i,level){

  let ins=
    d.type==="compare"?"ضع (> < =)" :
    d.type==="order"?"رتب من الأصغر إلى الأكبر" :
    d.type==="count"?"عدّ العناصر":"أوجد الناتج";

  let math="";

  if(d.type==="add")
    math=`${ar(d.a)} + ${ar(d.b)} = <span class="box"></span>`;

  if(d.type==="sub")
    math=`${ar(d.a)} - ${ar(d.b)} = <span class="box"></span>`;

  if(d.type==="compare")
    math=`${ar(d.a)} <span class="box"></span> ${ar(d.b)}`;

  if(d.type==="order")
    math=`${ar(d.a)} , ${ar(d.b)} , ${ar(d.c)} <br><br> □ □ □`;

  if(d.type==="count")
    math=`كم العدد؟ <span class="box"></span>`;

  return `
  <div class="q">

    <div class="qh">السؤال ${ar(i)}</div>
    <div class="step">التدرج: ${step(level)}</div>

    <div class="visual">${visual(d,level)}</div>

    <div style="text-align:center;font-weight:600;margin:6px 0">
      ${ins}
    </div>

    <div class="math">${math}</div>

  </div>`;
}

/* ================= البناء ================= */

function build(){

  used.clear();

  let skill=document.getElementById("skill").value;
  let level=parseInt(document.getElementById("level").value);
  let limit=parseInt(document.getElementById("limit").value);
  let count=parseInt(document.getElementById("count").value);

  let html=`
  <div class="page">

    <div class="title">ورقة عمل رياضيات</div>

    <div class="meta">
      <div>المعلم</div>
      <div>المدرسة</div>
      <div>المستوى: ${step(level)}</div>
    </div>

    <div class="student">
      اسم الطالب: ____________________
    </div>
  `;

  for(let i=1;i<=count;i++){

    let d,tries=0;

    do{
      d=generate(skill,limit);
      tries++;
    }while(isDup(d)&&tries<40);

    html+=render(d,i,level);
  }

  html+=`</div>`;

  document.getElementById("out").innerHTML=html;
}

build();

</script>

</body>
</html>
