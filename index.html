<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قصة الجمع الذكي</title>

<style>
body{
  margin:0;
  font-family:"Tajawal", Arial;
  background:linear-gradient(#e0f7fa,#ffffff);
}
.container{
  max-width:430px;
  margin:auto;
  padding:12px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-top:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
}
.char{
  display:flex;
  align-items:center;
  gap:10px;
}
.avatar{font-size:38px}
.name{font-weight:bold;color:#00695c}
.speech{
  background:#e0f2f1;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
  position:relative;
}
.voice{
  position:absolute;
  left:6px;
  top:6px;
  border:none;
  background:#26a69a;
  color:#fff;
  width:28px;height:28px;
  border-radius:50%;
}
.visual{
  display:flex;
  justify-content:center;
  gap:6px;
  margin:10px 0;
  flex-wrap:wrap;
}
.item{
  width:36px;
  height:36px;
  background:#ffca28;
  border-radius:50%;
  animation:pop .4s ease;
}
@keyframes pop{
  from{transform:scale(0)}
  to{transform:scale(1)}
}
input{
  width:80px;
  font-size:22px;
  text-align:center;
  border-radius:10px;
  border:2px solid #80cbc4;
}
button{
  margin-top:12px;
  padding:10px 18px;
  font-size:18px;
  background:#26a69a;
  color:white;
  border:none;
  border-radius:14px;
}
.hide{display:none}
</style>
</head>

<body>
<div class="container">

<!-- المقدمة -->
<div id="intro" class="card">
  <div class="char">
    <div class="avatar">🧔🏻‍♂️</div>
    <div class="name">الحكيم إبراهيم</div>
  </div>
  <div class="speech" id="introText"></div>
</div>

<!-- الدرس -->
<div id="lesson" class="card hide">

  <div class="char">
    <div class="avatar">👨‍🏫</div>
    <div class="name">المعلم محمد</div>
  </div>

  <div class="speech" id="teacherText"></div>

  <!-- تمثيل بصري -->
  <div class="visual" id="v1"></div>
  <div style="font-size:26px;font-weight:bold">+</div>
  <div class="visual" id="v2"></div>
  <hr>
  <div class="visual" id="vResult"></div>

  <p style="font-size:26px" id="question"></p>

  <input type="number" id="answer">
  <br>
  <button onclick="check()">تحقق</button>
</div>

</div>

<script>
let a,b;

function speak(txt){
  const u=new SpeechSynthesisUtterance(txt);
  u.lang="ar-SA";
  speechSynthesis.speak(u);
}

function showItems(id,count){
  const el=document.getElementById(id);
  el.innerHTML="";
  for(let i=0;i<count;i++){
    const d=document.createElement("div");
    d.className="item";
    el.appendChild(d);
  }
}

function newLesson(){
  a=Math.floor(Math.random()*5)+1;
  b=Math.floor(Math.random()*5)+1;

  const text=`اليوم سنتعلم الجمع. لدينا ${a} أشياء ثم نضيف ${b} أشياء أخرى.`;
  document.getElementById("teacherText").innerText=text;
  speak(text);

  showItems("v1",a);
  showItems("v2",b);
  document.getElementById("vResult").innerHTML="";

  document.getElementById("question").innerText=`كم أصبح المجموع؟`;
}

function check(){
  const val=Number(answer.value);
  if(val===a+b){
    showItems("vResult",a+b);
    const t="أحسنت! عندما جمعنا الأشياء أصبحت أكثر.";
    document.getElementById("teacherText").innerText=t;
    speak(t);
    setTimeout(newLesson,2500);
  }else{
    speak("حاول مرة أخرى وتذكر أننا نجمع الكل معًا");
  }
}

document.getElementById("introText").innerText=
"مرحبًا بك يا بطل. اليوم سنتعلم الجمع باستخدام النظر والعد.";
speak(document.getElementById("introText").innerText);

setTimeout(()=>{
  document.getElementById("intro").classList.add("hide");
  document.getElementById("lesson").classList.remove("hide");
  newLesson();
},4000);
</script>
</body>
</html>
