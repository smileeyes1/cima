<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تطبيق مواقع الافلام العربية</title>

  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    header {
      background: #222;
      padding: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .btn {
      display: inline-block;
      margin: 5px;
      padding: 12px 18px;
      background: #e91e63;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .btn:hover { background: #c2185b; }

    .top-controls {
      margin-top: 10px;
    }

    #message {
      margin: 20px;
      font-size: 18px;
      color: #ffeb3b;
    }
  </style>
</head>

<body>

  <header>
    <button class="btn" onclick="openSite('https://wecima.click')">وي سيما (بديل ماي سيما)</button>
    <button class="btn" onclick="openSite('https://cfu.cam')">سيما فور يو</button>
    <button class="btn" onclick="openSite('https://shahid4u.site')">شاهد فور يو</button>
    <button class="btn" onclick="openSite('https://egybest.tube')">ايجي بست</button>

    <div class="top-controls">
      <button class="btn" onclick="window.location.reload()">تحديث الصفحة</button>
    </div>
  </header>

  <div id="message">
    اضغط على الزر لفتح الموقع في تبويب جديد (يعمل بدون مشكلة فارغة)
  </div>

  <script>
    function openSite(url) {
      window.open(url, '_blank');
    }

    // فلتر اعلانات بسيط داخل الصفحة نفسها
    const adKeywords = ["ads", "doubleclick", "taboola", "popads", "banner", "sponsor"];
    const observer = new MutationObserver(() => {
      adKeywords.forEach(key => {
        document.querySelectorAll(`[src*="\( {key}"], [id*=" \){key}"], [class*="${key}"]`)
          .forEach(el => el.remove());
      });
    });
    observer.observe(document, { childList: true, subtree: true });

    window.open = (function(open) {
      return function(url) {
        return open.call(window, url, '_blank');
      };
    })(window.open);
  </script>

</body>
</html>
