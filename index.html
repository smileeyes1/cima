<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محرك أوراق العمل الفلسطيني - الجيل الاحترافي</title>

<style>

/* =========================
   الأساس
========================= */

*{
  box-sizing:border-box;
  font-family:"Cairo","Tahoma",sans-serif;
}

body{
  margin:0;
  background:#eef2f1;
}

/* إجبار الطباعة على إظهار كل شيء */
*{
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
}

/* =========================
   لوحة التحكم (لا تطبع)
========================= */

.panel{
  position:fixed;
  right:0;
  top:0;
  width:330px;
  height:100vh;
  background:#fff;
  padding:15px;
  overflow:auto;
  box-shadow:-4px 0 15px rgba(0,0,0,0.12);
}

.panel h2{
  margin-top:0;
  color:#1b5e20;
  font-size:18px;
}

label{
  display:block;
  margin-top:10px;
  font-weight:bold;
  font-size:13px;
}

input,select{
  width:100%;
  padding:9px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  width:100%;
  margin-top:10px;
  padding:11px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.gen{background:#2e7d32;color:#fff;}
.prt{background:#1565c0;color:#fff;}

/* =========================
   صفحة A4 (نظام ثابت)
========================= */

.page{
  width:210mm;
  min-height:297mm;
  background:white;
  margin:10px auto;
  margin-right:350px;
  padding:10mm;
  position:relative;
  overflow:hidden;
}

/* هوية خفيفة */
.page::before,
.page::after{
  content:"";
  position:absolute;
  border-radius:50%;
  opacity:0.05;
}

.page::before{
  width:180px;height:180px;
  background:#2e7d32;
  top:-60px;left:-60px;
}

.page::after{
  width:200px;height:200px;
  background:#1565c0;
  bottom:-70px;right:-70px;
}

/* =========================
   الترويسة (مضغوطة احترافية)
========================= */

.header{
  border-bottom:2px solid #2e7d32;
  padding-bottom:6px;
  margin-bottom:10px;
}

.title{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#1b5e20;
}

.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  font-size:11px;
  margin-top:8px;
}

.meta div{
  border:1px solid #ddd;
  padding:6px;
  border-radius:6px;
  background:#fafafa;
}

/* =========================
   السؤال
========================= */

.q{
  border:1px solid #cfd8dc;
  padding:8px;
  border-radius:10px;
  margin-top:8px;
  page-break-inside:avoid;
}

.qn{
  font-size:12px;
  font-weight:bold;
  color:#1565c0;
}

/* =========================
   أشكال مضمونة الطباعة
========================= */

.dot{
  width:14px;
  height:14px;
  border-radius:50%;
  border:2px solid #43a047;
  display:inline-block;
  margin:2px;
}

.box{
  width:12px;
  height:12px;
  border:2px solid #90caf9;
  display:inline-block;
  margin:2px;
}

/* =========================
   معادلة
========================= */

.math{
  display:flex;
  justify-content:center;
  gap:6px;
  font-size:18px;
  margin-top:6px;
}

.answer{
  width:45px;
  height:32px;
  border:2px dashed #555;
  border-radius:6px;
}

/* =========================
   الطباعة (فصل كامل)
========================= */

@media print{

  .panel{
    display:none !important;
  }

  body{
    margin:0;
  }

  .page{
    margin:0;
    width:210mm;
    min-height:297mm;
    box-shadow:none;
  }
}

@page{
  size:A4;
  margin:0;
}

</style>
</head>

<body>

<!-- =========================
   لوحة التحكم (إدخال فقط)
========================= -->

<div class="panel">

<h2>لوحة التحكم</h2>

<label>اسم الدرس</label>
<input id="lesson" value="الجمع ضمن ١٠">

<label>اسم المدرسة</label>
<input id="school" value="مدرسة فلسطين الأساسية">

<label>المديرية</label>
<input id="directorate" value="مديرية نابلس">

<label>الصف</label>
<select id="grade">
<option>الأول</option>
<option selected>الثاني</option>
<option>الثالث</option>
</select>

<label>اسم المعلم</label>
<input id="teacher" value="الأستاذ محمد">

<label>عدد الأسئلة</label>
<input id="count" type="number" value="12" min="4" max="20">

<button class="gen" onclick="generate()">توليد الورقة</button>
<button class="prt" onclick="window.print()">طباعة</button>

</div>

<!-- =========================
   مخرج الورقة
========================= -->

<div id="out"></div>

<script>

/* =========================
   أرقام شرقية
========================= */

function ar(n){
  return n.toString().replace(/[0-9]/g,d=>
    ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][d]
  );
}

/* =========================
   عشوائي
========================= */

function r(a,b){
  return Math.floor(Math.random()*(b-a+1))+a;
}

/* =========================
   سؤال تربوي
========================= */

function q(i){

  let a=r(0,10);
  let b=r(0,10-a);

  let dotsA = Array(a).fill('<span class="dot"></span>').join('');
  let dotsB = Array(b).fill('<span class="box"></span>').join('');

  return `
  <div class="q">

    <div class="qn">السؤال ${ar(i)}</div>

    <div>${dotsA}</div>
    <div>${dotsB}</div>

    <div class="math">
      <span>${ar(a)}</span>
      <span>+</span>
      <span>${ar(b)}</span>
      <span>=</span>
      <span class="answer"></span>
    </div>

  </div>
  `;
}

/* =========================
   توليد الورقة (Model داخل دالة)
========================= */

function generate(){

  const lesson=document.getElementById("lesson").value;
  const school=document.getElementById("school").value;
  const directorate=document.getElementById("directorate").value;
  const grade=document.getElementById("grade").value;
  const teacher=document.getElementById("teacher").value;
  const count=parseInt(document.getElementById("count").value);

  let html=`
  <div class="page">

    <div class="header">

      <div class="title">${lesson}</div>

      <div class="meta">

        <div>المدرسة: ${school}</div>
        <div>المديرية: ${directorate}</div>
        <div>الصف: ${grade}</div>
        <div>المعلم: ${teacher}</div>
        <div>الهدف: مهارة الجمع</div>
        <div>الزمن: 40 دقيقة</div>

      </div>

    </div>
  `;

  for(let i=1;i<=count;i++){
    html+=q(i);
  }

  html+=`</div>`;

  document.getElementById("out").innerHTML=html;
}

/* تشغيل افتراضي */
generate();

</script>

</body>
</html>
