<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تصحيح اتجاه النص</title>

<style>
body{
    font-family: Arial;
    background:#0f0f0f;
    color:#fff;
    margin:0;
    padding:15px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

h2{
    margin-bottom:10px;
    color:#00ffc8;
}

textarea{
    width:95%;
    height:160px;
    font-size:18px;
    padding:10px;
    direction:rtl;
    text-align:right;
    border-radius:10px;
    border:none;
    outline:none;
}

button{
    margin-top:10px;
    padding:10px 15px;
    border:none;
    border-radius:8px;
    background:#00ffc8;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

.output{
    width:95%;
    min-height:120px;
    margin-top:10px;
    background:#1e1e1e;
    padding:10px;
    border-radius:10px;
    direction:rtl;
    text-align:right;
    white-space:pre-wrap;
}

.small{
    font-size:12px;
    opacity:0.7;
    margin-top:5px;
}
</style>
</head>

<body>

<h2>أداة تصحيح اتجاه النص العربي</h2>

<textarea id="input" placeholder="اكتب أو الصق النص هنا..."></textarea>

<button onclick="fixText()">تصحيح</button>
<button onclick="copyText()">نسخ</button>

<div class="output" id="output"></div>

<div class="small">تعمل بدون إنترنت بعد الفتح</div>

<script>
function fixText(){
    let text = document.getElementById("input").value;

    const RTL = "\u200F"; // علامة RTL

    let fixed = RTL + text;
    fixed = fixed.replace(/\n/g, "\n" + RTL);

    document.getElementById("output").innerText = fixed;
}

function copyText(){
    let text = document.getElementById("output").innerText;
    navigator.clipboard.writeText(text);
    alert("تم النسخ");
}
</script>

</body>
</html>
