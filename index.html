<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قصة تفاعلية حاكمة — مفهوم القِسمة</title>

<style>
:root{
  --primary:#١e٤٠af; --danger:#dc٢٦٢٦; --bg:#f٤f٦f٨; --ink:#٠٠٠;
}
*{box-sizing:border-box}
body{
  margin:٠; padding:٠; background:var(--bg);
  font-family:"Tahoma","Arial",sans-serif; text-align:center; user-select:none;
}
header{background:var(--primary); color:#fff; padding:١٦px; font-size:٢em; font-weight:bold}
main{max-width:٩٦٠px; margin:٠ auto; padding:٢٠px}

/* شريط حركة هادئة (بديل فيديو صامت) */
.motion{position:relative; height:٥٦px; border:٣px solid var(--ink);
  border-radius:١٢px; background:#fff; overflow:hidden; margin:٠ auto ١٦px}
.dot{position:absolute; top:١٦px; width:٢٤px; height:٢٤px; border-radius:٥٠%;
  background:var(--primary); animation:glide ٤s linear infinite}
@keyframes glide{from{right:-٣٢px} to{right:calc(١٠٠% + ٣٢px)}}

.hint{font-size:١.٣em; color:#٣٣٣; margin:١٢px ٠ ٢٠px}

/* المشهد القصصي */
.scene{position:relative; background:#fff; border:٣px solid var(--ink);
  border-radius:١٢px; padding:٢٠px; margin-bottom:٢٠px}
.character{position:absolute; bottom:٨px; width:٨٠px; height:١٢٠px;
  border-radius:١٥px; background:#fde٦٨a; display:flex; align-items:flex-end;
  justify-content:center; font-size:٢em}
#sara{right:٢٠px} #kids{left:٢٠px}

.bubble{position:absolute; bottom:١٣٠px; background:#e٠f٢fe; border:٢px solid var(--ink);
  border-radius:١٢px; padding:٨px ١٢px; width:٢٢٠px; font-size:١.١em; display:none}
#bSara{right:١٠px} #bKids{left:١٠px}

/* التفاعل */
.sceneInteract{display:flex; justify-content:center; gap:٤٠px; flex-wrap:wrap}
.box{width:١٢٠px; min-height:١٦٠px; border:٣px solid var(--ink);
  border-radius:١٢px; padding:٨px; background:#fff}
.box-title{font-weight:bold; margin-bottom:٨px}
.items{display:flex; flex-wrap:wrap; justify-content:center; gap:٦px; min-height:٨٠px}

.apple{width:٤٠px; height:٤٠px; line-height:٤٠px; border-radius:٥٠%;
  background:var(--danger); color:#fff; font-size:١.٤em; cursor:grab; touch-action:none}

#result{display:none; font-size:١.٨em; font-weight:bold; color:var(--primary); margin-top:١٢px}
footer{font-size:١.٣em; font-weight:bold; margin-top:١٦px}

.controls{margin-top:١٢px}
button{padding:٨px ١٦px; border:٣px solid var(--ink); border-radius:١٠px; background:#fff}
button:active{transform:scale(٠.٩٨)}
</style>
</head>

<body>
<header>قصة تفاعلية حاكمة — مفهوم القِسمة</header>
<main>

<div class="motion" aria-hidden="true"><span class="dot"></span></div>
<div class="hint">ابدأ التوزيع حتى يحصل الجميع على العدد نفسه.</div>

<!-- المشهد القصصي -->
<div class="scene">
  <div class="character" id="sara">👩</div>
  <div class="bubble" id="bSara">معي ➑ تفّاحات.</div>

  <div class="character" id="kids">👦👦👦👦</div>
  <div class="bubble" id="bKids">نحن ➃ أطفال.</div>

  <div style="height:١٢٠px"></div>

  <div class="sceneInteract">
    <div class="box">
      <div class="box-title">التفاحات</div>
      <div class="items" id="source" data-source>
        <div class="apple" draggable="true">🍎</div><div class="apple" draggable="true">🍎</div>
        <div class="apple" draggable="true">🍎</div><div class="apple" draggable="true">🍎</div>
        <div class="apple" draggable="true">🍎</div><div class="apple" draggable="true">🍎</div>
        <div class="apple" draggable="true">🍎</div><div class="apple" draggable="true">🍎</div>
      </div>
    </div>

    <div class="box"><div class="box-title">طفل</div><div class="items" data-child></div></div>
    <div class="box"><div class="box-title">طفل</div><div class="items" data-child></div></div>
    <div class="box"><div class="box-title">طفل</div><div class="items" data-child></div></div>
    <div class="box"><div class="box-title">طفل</div><div class="items" data-child></div></div>
  </div>

  <div id="result">➑ ÷ ➃ = ➋</div>
  <footer>القِسمة = توزيع متساوٍ</footer>
</div>

<div class="controls"><button id="reset">إعادة المشهد</button></div>

</main>

<script>
/* توقيت القصة */
setTimeout(()=>bSara.style.display="block",٥٠٠);
setTimeout(()=>bKids.style.display="block",٢٥٠٠);

/* حَوْكمة التفاعل */
let dragged=null;
document.querySelectorAll(".apple").forEach(a=>{
  a.addEventListener("dragstart",()=>dragged=a);
  a.addEventListener("touchstart",()=>dragged=a,{passive:true});
});
document.querySelectorAll(".items").forEach(area=>{
  area.addEventListener("dragover",e=>e.preventDefault());
  area.addEventListener("drop",()=>tryDrop(area));
  area.addEventListener("touchend",()=>tryDrop(area));
});
function tryDrop(area){
  if(!dragged) return;
  const isChild=area.hasAttribute("data-child");
  const isSource=area.hasAttribute("data-source");
  if(isChild){
    if(area.children.length>=٢){ dragged=null; return; }
    area.appendChild(dragged);
  }else if(isSource){ area.appendChild(dragged); }
  dragged=null; check();
}
function check(){
  const kids=[...document.querySelectorAll("[data-child]")];
  const counts=kids.map(k=>k.children.length);
  document.getElementById("result").style.display = counts.every(c=>c===٢) ? "block" : "none";
}
reset.addEventListener("click",()=>{
  const src=document.getElementById("source");
  document.querySelectorAll("[data-child]").forEach(k=>{
    [...k.children].forEach(a=>src.appendChild(a));
  });
  result.style.display="none";
});
check();
</script>
</body>
</html>
