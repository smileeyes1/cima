<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>النظام الذكي لأوراق العمل</title>

<style>
:root{
  --primary:#1a73e8;
  --bg:#f4f6fb;
  --border:#e0e3e7;
  --soft:#eef2f7;
}

*{
  box-sizing:border-box;
  font-family:"Cairo","Tahoma";
}

body{
  margin:0;
  background:var(--bg);
}

/* لوحة التحكم */
.panel{
  background:#fff;
  padding:12px;
  border-bottom:1px solid var(--border);
}

.grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
}

input,select{
  padding:8px;
  border-radius:8px;
  border:1px solid var(--border);
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:var(--primary);
  color:white;
  cursor:pointer;
}

/* الصفحة */
.page{
  width:210mm;
  min-height:297mm;
  background:#fff;
  margin:15px auto;
  padding:15mm;
}

/* عنوان */
.title{
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

/* هدف */
.goal{
  text-align:center;
  margin-top:6px;
  font-size:13px;
  color:#444;
}

/* بيانات */
.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:10px;
}

.meta div{
  background:var(--soft);
  padding:6px;
  font-size:12px;
  border-radius:6px;
}

.student{
  margin-top:10px;
  padding:10px;
  background:var(--soft);
  border-radius:8px;
}

/* سؤال */
.q{
  margin-top:12px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:10px;
}

.inst{
  font-size:12px;
  color:#666;
}

.level{
  text-align:center;
  margin-top:6px;
  font-size:16px;
}

/* مربع إجابة */
.box{
  display:inline-block;
  width:60px;
  height:26px;
  border:2px dashed #666;
  border-radius:6px;
}

/* أزرار مقارنة */
.choice button{
  margin:3px;
  padding:6px 10px;
  border-radius:6px;
  border:1px solid #ccc;
  background:#fff;
  color:#000;
}

/* طباعة */
@media print{
  .panel{display:none;}
  body{background:#fff;}
}
</style>
</head>

<body>

<div class="panel">
<div class="grid">

<input id="student" placeholder="اسم الطالب">

<select id="grade">
<option value="1">الصف الأول</option>
<option value="2">الصف الثاني</option>
</select>

<select id="level">
<option value="easy">سهل</option>
<option value="mid">متوسط</option>
<option value="hard">متقدم</option>
</select>

<select id="skill">
<option value="mix">مختلط</option>
<option value="add">جمع</option>
<option value="sub">طرح</option>
<option value="compare">مقارنة</option>
<option value="order">ترتيب</option>
<option value="count">عد</option>
</select>

<input id="count" type="number" value="10" min="1" max="25">

</div>

<br>

<button onclick="build()">توليد الورقة</button>
<button onclick="window.print()">طباعة</button>

</div>

<div id="out"></div>

<script>

/* أرقام عربية */
function ar(n){
  return String(n).replace(/[0-9]/g,d=>
  ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][d]);
}

/* عشوائي */
const rand = (max)=> Math.floor(Math.random()*(max+1));

const symbols = ["🍎","⭐","🔵","🔺","🟢"];
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

function show(n){
  return pick(symbols).repeat(Math.min(n,10));
}

/* مفتاح منع التكرار المنطقي */
function key(d){
  if(d.type==="add" || d.type==="compare"){
    return d.type + ":" + [Math.min(d.a,d.b),Math.max(d.a,d.b)].join("-");
  }
  if(d.type==="sub"){
    return d.type + ":" + d.a + "-" + d.b;
  }
  if(d.type==="order"){
    return d.type + ":" + [d.a,d.b,d.c].sort((x,y)=>x-y).join("-");
  }
  return JSON.stringify(d);
}

/* مستوى */
function limitByLevel(level,grade){
  let base = grade==="1"?10:20;
  if(level==="easy") return Math.min(10,base);
  if(level==="mid") return Math.min(20,base);
  return base;
}

/* توليد */
function generate(skill,limit){

 if(skill==="mix"){
   skill = pick(["add","sub","compare","order","count"]);
 }

 if(skill==="add"){
   let a,b;
   do{
     a=rand(limit);
     b=rand(limit);
   }while(a+b>limit);
   return {type:"add",a,b};
 }

 if(skill==="sub"){
   let a=rand(limit);
   let b=rand(a);
   return {type:"sub",a,b};
 }

 if(skill==="compare"){
   let a=rand(limit),b=rand(limit);
   if(a===b) b++;
   return {type:"compare",a,b};
 }

 if(skill==="order"){
   return {
     type:"order",
     a:rand(limit),
     b:rand(limit),
     c:rand(limit)
   };
 }

 if(skill==="count"){
   return {type:"count",a:rand(limit)};
 }
}

/* عرض */
function render(d,i){

 let html = `<div class="q">
 <strong>السؤال ${ar(i)}</strong>`;

 if(d.type==="add"){
 html+=`
 <div class="inst">اجمع باستخدام العدّ</div>
 <div class="level">${show(d.a)} + ${show(d.b)}</div>
 <div class="level">${ar(d.a)} + ${ar(d.b)} = <span class="box"></span></div>`;
 }

 if(d.type==="sub"){
 html+=`
 <div class="inst">اطرح باستخدام الإزالة</div>
 <div class="level">${show(d.a)} − ${show(d.b)}</div>
 <div class="level">${ar(d.a)} − ${ar(d.b)} = <span class="box"></span></div>`;
 }

 if(d.type==="compare"){
 html+=`
 <div class="inst">اختر الإشارة الصحيحة</div>
 <div class="level">${ar(d.a)} ___ ${ar(d.b)}</div>
 <div class="choice">
 <button>></button>
 <button><</button>
 <button>=</button>
 </div>`;
 }

 if(d.type==="order"){
 html+=`
 <div class="inst">رتب تصاعديًا (اكتب الإجابة)</div>
 <div class="level">${ar(d.a)} ، ${ar(d.b)} ، ${ar(d.c)}</div>
 <div class="level">الإجابة: <span class="box"></span><span class="box"></span><span class="box"></span></div>`;
 }

 if(d.type==="count"){
 html+=`
 <div class="inst">عد واكتب العدد</div>
 <div class="level">${show(d.a)}</div>
 <div class="level"><span class="box"></span></div>`;
 }

 html+="</div>";
 return html;
}

/* بناء */
function build(){

 let used = new Set();

 let student=document.getElementById("student").value || "________";
 let grade=document.getElementById("grade").value;
 let level=document.getElementById("level").value;
 let skill=document.getElementById("skill").value;
 let count=parseInt(document.getElementById("count").value);

 let limit = limitByLevel(level,grade);

 let html=`
 <div class="page">

 <div class="title">ورقة عمل ذكية في الرياضيات</div>

 <div class="goal">المهارة المستهدفة: تنمية مهارات العدّ والجمع والطرح البصري</div>

 <div style="text-align:center;margin-top:5px;">
 مستوى: ${level} | الصف: ${grade}
 </div>

 <div class="meta">
 <div>المعلم: ______</div>
 <div>المدرسة: ______</div>
 <div>التاريخ: ______</div>
 </div>

 <div class="student">اسم الطالب: ${student}</div>
 `;

 for(let i=1;i<=count;i++){

   let d,tries=0;

   do{
     d=generate(skill,limit);
     tries++;
   }while(used.has(key(d)) && tries<50);

   used.add(key(d));
   html+=render(d,i);
 }

 html+="</div>";

 document.getElementById("out").innerHTML=html;
}

build();
</script>

</body>
</html>
