<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة أوراق العمل التعليمية</title>

<style>
body{
  margin:0;
  font-family:'Noto Naskh Arabic', Arial;
  background:#eef2f6;
}

.app{
  display:flex;
  height:100vh;
}

.sidebar{
  width:300px;
  background:#0f172a;
  color:#fff;
  padding:15px;
}

.main{
  flex:1;
  padding:15px;
  overflow:auto;
}

input,select,textarea,button{
  width:100%;
  margin:5px 0;
  padding:8px;
  border-radius:6px;
  border:none;
  font-family:inherit;
  direction:rtl;
}

button{cursor:pointer}

.btn1{background:#22c55e;color:#fff}
.btn2{background:#2563eb;color:#fff}
.btn3{background:#334155;color:#fff}

.card{
  background:#fff;
  padding:15px;
  border-radius:10px;
}

.title{
  text-align:center;
  font-weight:bold;
  font-size:20px;
}

.stage{
  border:1px dashed #444;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}

.q{
  border:1px solid #aaa;
  padding:8px;
  min-height:40px;
  border-radius:6px;
}

.hidden{display:none}

/* طباعة A4 حقيقية */
@media print{
  .sidebar{display:none}
  body{background:#fff}
  .main{padding:0}
  .card{box-shadow:none;border:none}

  #content{
    width:210mm;
    min-height:297mm;
    padding:20mm;
    margin:auto;
  }

  .stage{
    page-break-inside:avoid;
  }
}

@page{
  size:A4;
  margin:10mm;
}
</style>
</head>

<body>

<div class="app">

<!-- لوحة التحكم -->
<div class="sidebar" id="sidebar">

<h3>🏫 أوراق العمل</h3>

<input id="lesson" placeholder="اكتب اسم الدرس (مثال: الجمع ضمن ١٠)">

<select id="grade">
<option value="1">الصف الأول</option>
<option value="2">الصف الثاني</option>
</select>

<button class="btn1" onclick="generate()">توليد ورقة</button>
<button class="btn3" onclick="toggleSidebar()">إظهار / إخفاء</button>
<button class="btn2" onclick="window.print()">طباعة</button>

</div>

<!-- المحتوى -->
<div class="main">

<div class="card">
<div class="title" id="title">---</div>
<div id="content"></div>
</div>

</div>

</div>

<script>

/* =========================
تحويل الأرقام إلى شرقية
========================= */
function toArabic(n){
return n.toString()
.replace(/0/g,'٠')
.replace(/1/g,'١')
.replace(/2/g,'٢')
.replace(/3/g,'٣')
.replace(/4/g,'٤')
.replace(/5/g,'٥')
.replace(/6/g,'٦')
.replace(/7/g,'٧')
.replace(/8/g,'٨')
.replace(/9/g,'٩');
}

/* =========================
إظهار / إخفاء اللوحة
========================= */
function toggleSidebar(){
const sb=document.getElementById("sidebar");
sb.style.display = (sb.style.display==="none") ? "block" : "none";
}

/* =========================
تحديد نوع الدرس
========================= */
function detectType(text){

if(text.includes("جمع")) return "add";
if(text.includes("طرح")) return "sub";
if(text.includes("مقارنة") || text.includes("أكبر") || text.includes("أصغر")) return "compare";
if(text.includes("ترتيب")) return "order";

return "general";
}

/* =========================
أرقام عشوائية
========================= */
function rand(max){
return Math.floor(Math.random()*max)+1;
}

/* =========================
بناء الورقة حسب النوع
========================= */
function buildWorksheet(type){

let a = rand(10);
let b = rand(10);

if(type==="add"){
return [
"🧠 تمهيد: استخدم العد أو المكعبات",
`${toArabic(a)} + ${toArabic(b)} = ____`,
"✏️ تمرين إضافي",
`${toArabic(a+1)} + ${toArabic(b-1)} = ____`,
"🧩 مسألة حياتية: لدى طفل أشياء وأضيف له عدد آخر. احسب المجموع."
];
}

if(type==="sub"){
return [
"🧠 تمهيد: استخدم العد التنازلي",
`${toArabic(a+b)} - ${toArabic(b)} = ____`,
"✏️ تمرين إضافي",
`${toArabic(a+b+1)} - ${toArabic(a)} = ____`,
"🧩 مسألة حياتية: كان لدى طفل أشياء وفقد بعضها. احسب الباقي."
];
}

if(type==="compare"){
return [
"🧠 ضع علامة > أو < أو =",
`${toArabic(a)} ___ ${toArabic(b)}`,
`${toArabic(a+2)} ___ ${toArabic(b-1)}`,
"🧩 أيهما أكبر؟ ولماذا؟"
];
}

if(type==="order"){
return [
"🧠 رتب الأعداد من الأصغر إلى الأكبر",
`${toArabic(b)} , ${toArabic(a)} , ${toArabic(a+2)}`,
"✏️ ترتيب أعداد أخرى",
"🧩 تطبيق حياتي: رتب الأشياء من حولك"
];
}

return [
"🧠 فهم الدرس",
"✏️ تطبيق",
"🧩 مسألة حياتية"
];

}

/* =========================
توليد الورقة
========================= */
function generate(){

const lesson=document.getElementById("lesson").value;

const type=detectType(lesson);

document.getElementById("title").innerText=lesson;

let items=buildWorksheet(type);

let html="";

items.forEach(x=>{
html+=`
<div class="stage">
<div class="q">${x}</div>
</div>`;
});

document.getElementById("content").innerHTML=html;

}

</script>

</body>
</html>
