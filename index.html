<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مصحح النص العربي</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial;
    background:#0f1115;
    color:white;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    color:#00ffd0;
}

textarea{
    width:100%;
    height:220px;
    padding:12px;
    font-size:18px;
    border:none;
    border-radius:12px;
    outline:none;
    background:#1c1f26;
    color:white;
    direction:rtl;
    text-align:right;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

button{
    flex:1;
    min-width:140px;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.fix{background:#00ffd0;color:black;}
.copy{background:#3a86ff;color:white;}
.share{background:#8338ec;color:white;}
.print{background:#ffb703;color:black;}
.clear{background:#ef233c;color:white;}

.output{
    margin-top:20px;
    padding:15px;
    background:#1c1f26;
    border-radius:12px;
    min-height:150px;
    white-space:pre-wrap;
    direction:rtl;
    text-align:right;
}

/* 🔷 طباعة نظيفة */
@media print {

    body{
        background:white !important;
        color:black !important;
    }

    h1,
    textarea,
    .buttons{
        display:none !important;
    }

    .output{
        background:white !important;
        color:black !important;
        border:none !important;
        font-size:22px;
        line-height:2;
    }
}

</style>
</head>

<body>

<div class="container">

<h1>مصحح النص العربي</h1>

<textarea id="input" placeholder="اكتب أو الصق النص هنا..."></textarea>

<div class="buttons">

<button class="fix" onclick="fixText()">تصحيح</button>
<button class="copy" onclick="copyText()">نسخ</button>
<button class="share" onclick="shareText()">مشاركة</button>
<button class="print" onclick="printText()">طباعة</button>
<button class="clear" onclick="clearAll()">مسح</button>

</div>

<div class="output" id="output"></div>

</div>

<script>

function fixText(){

    let text = document.getElementById("input").value;

    const RTL = "\u200F";

    let fixed = RTL + text;
    fixed = fixed.replace(/\n/g, "\n" + RTL);

    document.getElementById("output").innerText = fixed;
}

function copyText(){

    let text = document.getElementById("output").innerText;

    if(!text){
        alert("لا يوجد نص");
        return;
    }

    navigator.clipboard.writeText(text);
    alert("تم النسخ");
}

function shareText(){

    let text = document.getElementById("output").innerText;

    if(!text){
        alert("لا يوجد نص للمشاركة");
        return;
    }

    if(navigator.share){

        navigator.share({
            title: "نص مصحح",
            text: text
        });

    }else{
        alert("المشاركة غير مدعومة");
    }
}

function printText(){

    let text = document.getElementById("output").innerText;

    if(!text){
        alert("لا يوجد نص للطباعة");
        return;
    }

    window.print();
}

function clearAll(){
    document.getElementById("input").value = "";
    document.getElementById("output").innerText = "";
}

</script>

</body>
</html>
