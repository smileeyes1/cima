<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قصة العدل</title>

<style>
:root{
  --tap: 56px;
  --plate: 90px;
  --apple: 32px;
}

body{
  margin:0;
  font-family: system-ui;
  background:#fff;
}

main{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:12px;
  box-sizing:border-box;
}

/* STORY ZONE */
.story-zone{
  text-align:center;
}
.character{
  width:80px;
  height:80px;
  margin:0 auto;
  border-radius:50%;
  background:#f2d6b3;
  position:relative;
}
.character::before{
  content:"";
  position:absolute;
  top:24px; left:20px;
  width:12px; height:12px;
  background:#000; border-radius:50%;
}
.character::after{
  content:"";
  position:absolute;
  top:24px; right:20px;
  width:12px; height:12px;
  background:#000; border-radius:50%;
}
.mouth{
  width:30px; height:8px;
  border-bottom:3px solid #000;
  border-radius:0 0 30px 30px;
  margin:40px auto 0;
}

.story-text{
  margin-top:8px;
  padding:8px;
  border:2px solid #000;
  border-radius:12px;
}

/* ACTION ZONE */
.action-zone{
  flex-grow:1;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  align-items:center;
}

.plates{
  width:100%;
  display:flex;
  justify-content:space-around;
}
.plate{
  width:var(--plate);
  height:var(--plate);
  border:3px solid #000;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:calc(var(--plate) / 3);
}

.apple-source{
  display:flex;
  gap:6px;
  justify-content:center;
  min-height:var(--apple);
}
.apple{
  font-size:var(--apple);
  transition:transform .5s ease;
}

/* CONTROL ZONE */
.control-zone{
  display:flex;
  justify-content:center;
}
button{
  min-height:var(--tap);
  padding:0 28px;
  border:3px solid #000;
  background:#fff;
  font-size:1.1rem;
}
button:disabled{
  opacity:.5;
}
</style>
</head>

<body>
<main>

<!-- STORY -->
<div class="story-zone">
  <div class="character">
    <div class="mouth"></div>
  </div>
  <div class="story-text" id="story">
    لدينا تفاح.
  </div>
</div>

<!-- ACTION -->
<div class="action-zone">

  <div class="plates">
    <div class="plate" id="p0"></div>
    <div class="plate" id="p1"></div>
    <div class="plate" id="p2"></div>
    <div class="plate" id="p3"></div>
  </div>

  <div class="apple-source" id="apples">
    <div class="apple">🍎</div><div class="apple">🍎</div><div class="apple">🍎</div><div class="apple">🍎</div>
    <div class="apple">🍎</div><div class="apple">🍎</div><div class="apple">🍎</div><div class="apple">🍎</div>
  </div>

</div>

<!-- CONTROL -->
<div class="control-zone">
  <button onclick="next()">ضع تفاحة</button>
</div>

</main>

<script>
let step = 0;
let apples = Array.from(document.querySelectorAll('.apple'));
let plates = [p0,p1,p2,p3];
let btn = document.querySelector('button');

function next(){
  if(step >= 8){
    btn.disabled = true;
    return;
  }

  // move apple
  let a = apples[step];
  let target = plates[step % 4];
  let r1 = a.getBoundingClientRect();
  let r2 = target.getBoundingClientRect();

  let dx = r2.left - r1.left + (r2.width/2);
  let dy = r2.top - r1.top;

  a.style.transform = `translate(${dx}px, ${dy}px) scale(.8)`;

  setTimeout(()=>{
    target.textContent += "🍎";
    a.style.visibility = "hidden";
  },400);

  step++;

  if(step === 1){
    story.textContent = "نضع التفاح...";
  }
  if(step === 4){
    story.textContent = "هل هذا عادل؟";
  }
  if(step === 8){
    story.textContent = "✅ الآن هذا عادل";
  }
}
</script>

</body>
</html>
