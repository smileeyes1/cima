<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محرك الرياضيات الذكي - الإصدار الاحترافي</title>

<style>

*{
  box-sizing:border-box;
  font-family:"Cairo","Tahoma",sans-serif;
}

body{
  margin:0;
  background:#e9f2f3;
}

/* لوحة التحكم */
.panel{
  background:#fff;
  padding:15px;
  border-bottom:3px solid #1b5e20;
}

.row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

label{
  font-size:12px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.gen{background:#1b5e20;color:white;}
.prt{background:#1565c0;color:white;}

/* الصفحة */
.page{
  width:210mm;
  min-height:297mm;
  background:white;
  margin:15px auto;
  padding:12mm;
}

.title{
  text-align:center;
  font-size:24px;
  color:#1b5e20;
  font-weight:bold;
}

.subtitle{
  text-align:center;
  font-size:12px;
  color:#666;
}

.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:10px;
  font-size:11px;
}

.meta div{
  padding:6px;
  border-radius:6px;
  background:#f7f7f7;
  border:1px solid #ddd;
}

.student{
  margin-top:10px;
  padding:10px;
  border:2px dashed #888;
  border-radius:10px;
}

.line{
  display:inline-block;
  width:180px;
  border-bottom:1px solid #000;
}

/* السؤال */
.q{
  margin-top:12px;
  padding:12px;
  border-radius:14px;
  border:1px solid #d0d7d7;
  background:linear-gradient(180deg,#fff,#f9fbfb);
}

.q-header{
  font-size:13px;
  font-weight:bold;
  color:#1b5e20;
  margin-bottom:6px;
}

.visual{
  text-align:center;
  font-size:18px;
  margin:6px 0;
}

.math{
  display:flex;
  justify-content:center;
  gap:8px;
  font-size:22px;
  align-items:center;
}

.answer{
  width:55px;
  height:34px;
  border:2px dashed #444;
  border-radius:6px;
}

/* طباعة */
@media print{
  .panel{display:none;}
  body{background:white;}
  .page{margin:0;}
}

@page{
  size:A4;
  margin:0;
}

</style>
</head>

<body>

<div class="panel">

<h3>محرك الرياضيات الذكي - احترافي</h3>

<div class="row">

<div>
<label>المهارة</label>
<select id="skill">
<option value="count">العدّ</option>
<option value="compare">المقارنة</option>
<option value="order">الترتيب</option>
<option value="add">الجمع</option>
<option value="sub">الطرح</option>
<option value="word">مسألة لفظية</option>
<option value="place">القيمة المكانية</option>
</select>
</div>

<div>
<label>الحد العددي</label>
<select id="limit">
<option value="10">ضمن 10</option>
<option value="20">ضمن 20</option>
<option value="100">ضمن 100</option>
</select>
</div>

<div>
<label>عدد الأسئلة</label>
<input id="count" type="number" value="10">
</div>

<div>
<label>اسم الدرس</label>
<input id="lesson" value="رياضيات">
</div>

</div>

<div class="row">

<div>
<label>المعلم</label>
<input id="teacher" value="المعلم">
</div>

<div>
<label>المدرسة</label>
<input id="school" value="مدرسة">
</div>

<div>
<label>إظهار الإجابات</label>
<select id="answers">
<option value="no">لا</option>
<option value="yes">نعم</option>
</select>
</div>

<div></div>

</div>

<button class="gen" onclick="build()">توليد</button>
<button class="prt" onclick="window.print()">طباعة</button>

</div>

<div id="out"></div>

<script>

/* ================= أدوات أساسية ================= */

function ar(n){
  return String(n).replace(/[0-9]/g,d=>
    ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][d]
  );
}

function rand(max){
  return Math.floor(Math.random()*(max+1));
}

/* ================= سجل منع التكرار ================= */

let used = new Set();

function pairKey(a,b){
  return a<=b ? `${a}:${b}` : `${b}:${a}`;
}

/* ================= تحقق صارم ================= */

function validate(d,skill,limit){

  if(skill==="add"){
    if(d.a + d.b > limit) return false;
    if(d.a===0 || d.b===0) return false;
  }

  if(skill==="sub"){
    if(d.b > d.a) return false;
  }

  if(skill==="compare"){
    if(d.a === d.b) return false;
  }

  if(skill==="order"){
    if(d.a===d.b || d.a===d.c || d.b===d.c) return false;
  }

  return true;
}

/* ================= توليد مضبوط ================= */

function generate(skill,limit){

  let a,b,c;

  switch(skill){

    case "count":
      return {type:"count",a:rand(limit)};

    case "compare":
      a=rand(limit); b=rand(limit);
      if(a===b) b=(b+1)%(limit+1);
      return {type:"compare",a,b};

    case "order":
      do{
        a=rand(limit); b=rand(limit); c=rand(limit);
      }while(a===b || b===c || a===c);
      return {type:"order",a,b,c};

    case "add":
      do{
        a=rand(limit); b=rand(limit);
      }while(a+b>limit || a===0 || b===0);
      return {type:"add",a,b};

    case "sub":
      a=rand(limit);
      b=rand(a);
      if(a===0) a=1;
      return {type:"sub",a,b};

    case "word":
      return {type:"word",a:rand(limit),b:rand(limit)};

    case "place":
      return {type:"place",a:rand(limit),b:rand(limit)};
  }
}

/* ================= fallback ذكي متدرج ================= */

function fallback(skill){

  if(skill==="add") return {type:"add",a:1,b:1};
  if(skill==="sub") return {type:"sub",a:2,b:1};
  if(skill==="compare") return {type:"compare",a:1,b:2};
  if(skill==="order") return {type:"order",a:1,b:2,c:3};

  return {type:"count",a:1};
}

/* ================= محرك استقرار نهائي ================= */

function stableGenerate(skill,limit){

  let d;
  let tries=0;

  while(tries<35){

    d = generate(skill,limit);

    if(!validate(d,skill,limit)){
      tries++;
      continue;
    }

    if(d.a!==undefined && d.b!==undefined){

      let k = pairKey(d.a,d.b);

      if(used.has(k)){
        tries++;
        continue;
      }

      used.add(k);
    }

    return d;
  }

  return fallback(skill);
}

/* ================= العرض ================= */

function render(d){

  if(d.type==="add"){
    return `
    <div class="q">
      <div class="q-header">الجمع</div>
      <div class="visual">🍎➕🍌</div>
      <div class="math">
        <span>${ar(d.a)}</span>
        <span>+</span>
        <span>${ar(d.b)}</span>
        <span>=</span>
        <span class="answer"></span>
      </div>
    </div>`;
  }

  if(d.type==="sub"){
    return `
    <div class="q">
      <div class="q-header">الطرح</div>
      <div class="visual">🍎➖🍌</div>
      <div class="math">
        <span>${ar(d.a)}</span>
        <span>-</span>
        <span>${ar(d.b)}</span>
        <span>=</span>
        <span class="answer"></span>
      </div>
    </div>`;
  }

  if(d.type==="compare"){
    return `
    <div class="q">
      <div class="q-header">قارن</div>
      <div class="math">
        <span>${ar(d.a)}</span>
        <span>___</span>
        <span>${ar(d.b)}</span>
      </div>
    </div>`;
  }

  if(d.type==="order"){
    return `
    <div class="q">
      <div class="q-header">رتب</div>
      <div class="math">
        <span>${ar(d.a)}</span>
        <span>${ar(d.b)}</span>
        <span>${ar(d.c)}</span>
      </div>
    </div>`;
  }

  if(d.type==="count"){
    return `
    <div class="q">
      <div class="q-header">عدّ</div>
      <div class="visual">⭐ ⭐ ⭐</div>
      <div class="math">
        <span class="answer"></span>
      </div>
    </div>`;
  }

  return `<div class="q"></div>`;
}

/* ================= بناء الورقة ================= */

function build(){

  used.clear();

  let skill=document.getElementById("skill").value;
  let limit=parseInt(document.getElementById("limit").value);
  let count=parseInt(document.getElementById("count").value);
  let lesson=document.getElementById("lesson").value;
  let teacher=document.getElementById("teacher").value;
  let school=document.getElementById("school").value;

  let html=`
  <div class="page">

    <div class="title">${lesson}</div>
    <div class="subtitle">محرك ذكي احترافي لمنهاج الصفوف الأولى</div>

    <div class="meta">
      <div>المعلم: ${teacher}</div>
      <div>المدرسة: ${school}</div>
      <div>الحد: ${ar(limit)}</div>
    </div>

    <div class="student">
      اسم الطالب: <span class="line"></span>
    </div>
  `;

  for(let i=1;i<=count;i++){
    let d = stableGenerate(skill,limit);
    html += render(d);
  }

  html += `</div>`;

  document.getElementById("out").innerHTML = html;
}

build();

</script>

</body>
</html>
