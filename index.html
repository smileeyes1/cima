<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مولد أوراق العمل الفلسطينية</title>

<style>

/* =========================
   إعدادات عامة
========================= */

*{
    box-sizing:border-box;
    font-family:"Cairo","Tahoma",sans-serif;
}

body{
    margin:0;
    background:#eef3f1;
}

/* إجبار الطباعة على إظهار الألوان والأشكال */
*{
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
}

/* =========================
   لوحة التحكم
========================= */

.control-panel{
    width:320px;
    position:fixed;
    right:0;
    top:0;
    height:100vh;
    background:#fff;
    padding:16px;
    overflow:auto;
    box-shadow:-3px 0 10px rgba(0,0,0,0.1);
}

label{
    display:block;
    margin-top:10px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    margin-top:12px;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.generate{background:#2e7d32;color:#fff;}
.print{background:#1565c0;color:#fff;}

/* =========================
   صفحة A4
========================= */

.page{
    width:210mm;
    min-height:297mm;
    background:white;
    margin:10px auto;
    margin-right:340px;
    padding:8mm;
    position:relative;
}

/* إزالة هوامش الطباعة الافتراضية */
@page{
    size:A4;
    margin:0;
}

/* =========================
   الترويسة (مصغرة ومرفوعة)
========================= */

.header{
    border-bottom:2px solid #2e7d32;
    padding-bottom:6px;
    margin-bottom:8px;
}

.title{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#1b5e20;
}

.info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-top:8px;
    font-size:12px;
}

.box{
    border:1px solid #ccc;
    padding:6px;
    border-radius:6px;
    background:#fafafa;
}

/* =========================
   الأسئلة
========================= */

.question{
    border:1px solid #cfd8dc;
    border-radius:10px;
    padding:8px;
    margin-bottom:8px;
    page-break-inside:avoid;
}

.qnum{
    color:#1565c0;
    font-weight:bold;
    margin-bottom:6px;
}

/* =========================
   الأشكال (مضمونة الطباعة)
========================= */

.shape{
    width:16px;
    height:16px;
    border-radius:50%;
    border:2px solid #43a047;
    display:inline-block;
    margin:2px;
}

.square{
    width:14px;
    height:14px;
    border:2px solid #90caf9;
    display:inline-block;
    margin:2px;
}

/* =========================
   معادلة
========================= */

.math{
    display:flex;
    justify-content:center;
    gap:8px;
    font-size:20px;
    margin-top:6px;
}

.answer{
    width:50px;
    height:35px;
    border:2px dashed #666;
    border-radius:6px;
}

/* =========================
   الطباعة
========================= */

@media print{

    .control-panel{
        display:none !important;
    }

    body{
        margin:0;
    }

    .page{
        margin:0;
        width:210mm;
        min-height:297mm;
        box-shadow:none;
    }
}

</style>
</head>

<body>

<!-- لوحة التحكم -->
<div class="control-panel">

<h3>إعداد الورقة</h3>

<label>الصف</label>
<select id="grade">
<option>الأول</option>
<option selected>الثاني</option>
<option>الثالث</option>
</select>

<label>عدد الأسئلة</label>
<input type="number" id="count" value="10" min="4" max="20">

<button class="generate" onclick="generate()">إنشاء</button>
<button class="print" onclick="window.print()">طباعة</button>

</div>

<!-- الصفحة -->
<div id="pages"></div>

<script>

function east(n){
    const m=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
    return n.toString().replace(/[0-9]/g,d=>m[d]);
}

function rand(a,b){
    return Math.floor(Math.random()*(b-a+1))+a;
}

/* تقسيم تلقائي لصفحات A4 (أهم نقطة جديدة) */
function splitIntoPages(items, perPage){

    let pages=[];

    for(let i=0;i<items.length;i+=perPage){
        pages.push(items.slice(i,i+perPage));
    }

    return pages;
}

/* توليد سؤال */
function q(i){

    let a=rand(0,10);
    let b=rand(0,10-a);

    return `
    <div class="question">

        <div class="qnum">السؤال ${east(i)}</div>

        <div>
            ${Array(a).fill('<span class="shape"></span>').join('')}
            ${Array(b).fill('<span class="square"></span>').join('')}
        </div>

        <div class="math">
            <span>${east(a)}</span>
            <span>+</span>
            <span>${east(b)}</span>
            <span>=</span>
            <span class="answer"></span>
        </div>

    </div>
    `;
}

/* بناء الصفحات */
function generate(){

    const count=parseInt(document.getElementById("count").value);

    let items=[];

    for(let i=1;i<=count;i++){
        items.push(q(i));
    }

    let pages=splitIntoPages(items,8); // أهم تحسين: ضبط تلقائي لـ A4

    let html="";

    pages.forEach((p,idx)=>{

        html+=`
        <div class="page">

            <div class="header">

                <div class="title">
                    ورقة عمل تعليمية
                </div>

                <div class="info">

                    <div class="box">الصف: ${document.getElementById("grade").value}</div>
                    <div class="box">الهدف: تنمية المهارات</div>
                    <div class="box">الزمن: 40 دقيقة</div>

                </div>

            </div>

            ${p.join("")}

        </div>
        `;

    });

    document.getElementById("pages").innerHTML=html;

}

/* تشغيل افتراضي */
generate();

</script>

</body>
</html>
