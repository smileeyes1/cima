<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حقائق الضرب للعدد ١٠</title>

<style>
:root{
  --tap: 56px;
  --step: 40px;
}
body{
  margin:0;
  font-family: system-ui;
  background:#ffffff;
}
main{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:12px;
  box-sizing:border-box;
}

/* STORY ZONE */
.story-zone{
  text-align:center;
}
.character{
  width:72px;
  height:72px;
  margin:0 auto;
  border-radius:50%;
  background:#f1d2b6;
  position:relative;
}
.character:before,
.character:after{
  content:"";
  position:absolute;
  top:22px;
  width:10px;
  height:10px;
  background:#000;
  border-radius:50%;
}
.character:before{left:18px;}
.character:after{right:18px;}
.mouth{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  width:28px;
  height:10px;
  border-bottom:3px solid #000;
  border-radius:0 0 30px 30px;
}
.story-text{
  margin-top:8px;
  padding:8px;
  border:2px solid #000;
  border-radius:12px;
  font-size:1.1rem;
}

/* ACTION ZONE */
.action-zone{
  flex-grow:1;
  display:flex;
  align-items:center;
  justify-content:center;
}
.path{
  display:flex;
  gap:6px;
}
.step{
  width:var(--step);
  height:var(--step);
  border:2px solid #000;
  border-radius:50%;
  opacity:0;
  transition:opacity .3s ease;
}

/* CONTROL ZONE */
.control-zone{
  display:flex;
  justify-content:center;
}
button{
  min-height:var(--tap);
  padding:0 28px;
  border:3px solid #000;
  background:#fff;
  font-size:1.1rem;
}
button:disabled{
  opacity:.5;
}
</style>
</head>

<body>
<main>

<!-- STORY -->
<div class="story-zone">
  <div class="character">
    <div class="mouth"></div>
  </div>
  <div class="story-text" id="story">أمشي عشر خطوات كل مرة.</div>
</div>

<!-- ACTION -->
<div class="action-zone">
  <div class="path" id="path"></div>
</div>

<!-- CONTROL -->
<div class="control-zone">
  <button id="btn" onclick="next()">امشِ مرة أخرى</button>
</div>

</main>

<script>
const story = document.getElementById("story");
const path = document.getElementById("path");
const btn = document.getElementById("btn");

let state = 0;      // ٠ إلى ٥
let groups = 0;     // عدد مرات المشي المنفذة

function drawTenSteps(){
  path.innerHTML = "";
  for(let i=0;i<10;i++){
    const s = document.createElement("div");
    s.className = "step";
    path.appendChild(s);
    setTimeout(()=>{ s.style.opacity = 1; }, i*70);
  }
}

function clearSteps(){
  setTimeout(()=>{ path.innerHTML = ""; }, 1000);
}

function next(){

  // STATES 1–3: المشي المتكرر
  if(state >= 0 && state <= 2){
    drawTenSteps();
    groups++;
    state++;
    clearSteps();

    // بعد ثلاث مرات ننتقل للحكم
    if(groups === 3){
      setTimeout(()=>{ state = 3; }, 1100);
    }
    return;
  }

  // STATE 4: الحكم
  if(state === 3){
    story.textContent = "كل مرة عشر.";
    state = 4;
    return;
  }

  // STATE 5: التسمية والتوقف
  if(state === 4){
    story.textContent = "١٠ × ٣ = ٣٠";
    btn.disabled = true;
    state = 5;
    return;
  }
}
</script>

</body>
</html>
