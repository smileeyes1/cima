<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>درس الجمع بالقلوب</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Tajawal",Arial;
  background:linear-gradient(#e0f7fa,#ffffff);
  text-align:center;
  color:#00695c;
}

.container{
  width:100%;
  max-width:480px;
  margin:auto;
  padding:clamp(10px,3vw,20px);
}

.card{
  background:#fff;
  border-radius:20px;
  padding:18px;
  margin-top:15px;
  box-shadow:0 6px 14px rgba(0,0,0,.12);
}

.character{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.avatar{font-size:44px}
.name{font-weight:bold;font-size:20px}

.speech{
  background:#e0f2f1;
  border-radius:16px;
  padding:14px 14px 14px 44px;
  margin:12px 0;
  position:relative;
  min-height:70px;
  font-size:17px;
}

.voice-btn{
  position:absolute;
  left:8px;
  top:8px;
  width:30px;
  height:30px;
  border:none;
  border-radius:50%;
  background:#26a69a;
  color:#fff;
  font-size:16px;
}

.question{
  font-size:32px;
  margin:16px 0;
  font-weight:bold;
}

input{
  font-size:24px;
  width:90px;
  text-align:center;
  padding:8px;
  border-radius:12px;
  border:3px solid #80cbc4;
}

button{
  margin-top:12px;
  padding:10px 20px;
  font-size:18px;
  border:none;
  border-radius:14px;
  background:#26a69a;
  color:white;
}

/* القلوب */
.hearts-row{
  display:flex;
  justify-content:center;
  gap:6px;
  flex-wrap:wrap;
  margin:10px 0;
}

.heart{
  font-size:30px;
  animation:glow 1.5s infinite alternate;
}

@keyframes glow{
  from{transform:scale(1);opacity:.7}
  to{transform:scale(1.2);opacity:1}
}

/* التكيّف مع الهاتف */
@media(max-width:480px){
  .question{font-size:26px}
  .heart{font-size:26px}
}

/* التكيّف مع الكمبيوتر */
@media(min-width:768px){
  .container{max-width:720px}
  .question{font-size:34px}
  .heart{font-size:36px}
}
</style>
</head>

<body>
<div class="container">

<!-- المقدمة -->
<div id="intro" class="card">
  <div class="character">
    <div class="avatar">🧔🏻‍♂️</div>
    <div class="name">الحكيم إبراهيم</div>
  </div>
  <div class="speech" id="introText">
    مرحبًا يا بطل. اليوم سنتعلم الجمع بهدوء ومحبة. خذ وقتك، فالله مع الصابرين.
  </div>
  <button class="voice-btn" onclick="speak(introText.innerText)">🔊</button>

  <p>اسم الطالب:</p>
  <input id="studentName" placeholder="اسمك يا بطل">

  <p>اسم ولي الأمر:</p>
  <input id="parentName" placeholder="اسم الوالد أو الوالدة">

  <br>
  <button onclick="start()">ابدأ الدرس</button>
</div>

<!-- الدرس -->
<div id="lesson" class="card" style="display:none">

  <div class="character">
    <div class="avatar">👨‍🏫</div>
    <div class="name">المعلم محمد</div>
  </div>

  <div class="speech" id="teacherText"></div>
  <button class="voice-btn" onclick="speak(teacherText.innerText)">🔊</button>

  <div class="question" id="question"></div>

  <div id="heartsA" class="hearts-row"></div>
  <div style="font-size:26px;font-weight:bold">+</div>
  <div id="heartsB" class="hearts-row"></div>
  <div id="heartsResult" class="hearts-row"></div>

  <input type="number" id="answer" placeholder="الناتج">
  <br>
  <button onclick="check()">تحقق</button>

  <div id="nextArea" style="display:none">
    <button id="nextBtn" disabled onclick="next()">التالي (١٠)</button>
  </div>

</div>
</div>

<script>
let student="", parent="";
let a=0,b=0;
let counter=10,timer=null;

function speak(txt){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang="ar-SA";
  speechSynthesis.speak(u);
}

function eastern(n){
  return n.toString().replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
}

function hearts(id,count){
  const el=document.getElementById(id);
  el.innerHTML="";
  for(let i=0;i<count;i++){
    const h=document.createElement("span");
    h.className="heart";
    h.innerText="❤";
    el.appendChild(h);
  }
}

function start(){
  student=studentName.value||"بطلنا";
  parent=parentName.value||"ولي أمره الكريم";
  intro.style.display="none";
  lesson.style.display="block";
  newQuestion();
}

function newQuestion(){
  a=Math.floor(Math.random()*5)+1;
  b=Math.floor(Math.random()*5)+1;

  teacherText.innerText=
  `يا ${student}، انظر إلى القلوب وعدّها بهدوء. الجمع يعني أننا نضم الأشياء معًا.`;

  speak(teacherText.innerText);

  question.innerText=`${eastern(a)} + ${eastern(b)}`;

  hearts("heartsA",a);
  hearts("heartsB",b);
  hearts("heartsResult",0);

  answer.value="";
  nextArea.style.display="none";
}

function check(){
  if(Number(answer.value)==a+b){
    hearts("heartsResult",a+b);
    teacherText.innerText=
    `أحسنت يا ${student}. محاولتك عبادة جميلة، والله يبارك فيك.`;
    speak(teacherText.innerText);
    startTimer();
  }else{
    speak(`لا بأس يا ${student}. خذ نفسًا عميقًا، والله مع الصابرين.`);
  }
}

function startTimer(){
  nextArea.style.display="block";
  counter=10;
  nextBtn.disabled=true;
  nextBtn.innerText=`التالي (${counter})`;

  timer=setInterval(()=>{
    counter--;
    nextBtn.innerText=`التالي (${counter})`;
    if(counter<=0){
      clearInterval(timer);
      nextBtn.disabled=false;
      nextBtn.innerText="التالي";
    }
  },1000);
}

function next(){
  newQuestion();
}
</script>

</body>
</html>
