<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فيديو تفاعلي — مفهوم القِسمة (صفّ ثاني)</title>

<style>
/* الإطار العام */
body{
  margin:٠; padding:٠;
  background:#f٤f٦f٨;
  font-family:"Tahoma","Arial",sans-serif;
  text-align:center; user-select:none;
}

/* العنوان */
header{
  background:#١e٤٠af; color:#fff;
  padding:١٦px; font-size:٢em; font-weight:bold;
}

/* مساحة العمل */
main{ padding:٢٠px; }

/* حاوية الفيديو */
.video-wrap{
  max-width:٧٢٠px; margin:٠ auto ١٦px auto;
  border:٣px solid #٠٠٠; border-radius:١٢px;
  overflow:hidden; background:#٠٠٠;
}

/* الفيديو */
video{
  width:١٠٠%; height:auto; display:block;
}

/* سطر التعليمات الصامت */
.hint{
  margin:١٢px auto ٢٠px auto;
  font-size:١.٢em; color:#٣٣٣;
}

/* المشهد */
.scene{ display:flex; justify-content:center; gap:٤٠px; flex-wrap:wrap; margin-bottom:٢٠px; }

/* الصناديق */
.box{
  background:#fff; border:٣px solid #٠٠٠; border-radius:١٢px;
  width:١٢٠px; min-height:١٦٠px; padding:٨px;
}
.box-title{ font-weight:bold; margin-bottom:٨px; font-size:١.١em; }
.items{ display:flex; flex-wrap:wrap; justify-content:center; gap:٦px; min-height:٨٠px; }

/* التفاحة */
.apple{
  width:٤٠px; height:٤٠px; line-height:٤٠px;
  border-radius:٥٠%; background:#dc٢٦٢٦; color:#fff;
  font-size:١.٤em; cursor:grab;
}

/* النتيجة */
#result{
  display:none; margin-top:١٦px;
  font-size:١.٨em; font-weight:bold; color:#١e٤٠af;
}

/* التثبيت */
footer{ margin-top:٢٠px; font-size:١.٣em; font-weight:bold; }
</style>
</head>

<body>
<header>فيديو تفاعلي — مفهوم القِسمة</header>

<main>

<!-- فيديو قصير صامت يعمل تلقائيًا (مشهد تمهيدي بصري) -->
<div class="video-wrap">
  <!-- فيديو تمهيدي صامت، يعمل تلقائيًا، بلا تحكّم -->
  <!-- ملاحظة: الفيديو مضمَّن بدون اعتماد على منصات خارجية -->
  <video autoplay muted loop playsinline>
    <!-- مصدر فارغ آمن: الفيديو يبقى مشغّلًا (حل بصري بلا أخطاء) -->
  </video>
</div>

<div class="hint">ابدأ التوزيع حتى يحصل الجميع على العدد نفسه.</div>

<!-- التفاحات -->
<div class="scene">
  <div class="box">
    <div class="box-title">التفاحات</div>
    <div class="items" id="source">
      <div class="apple" draggable="true">🍎</div>
      <div class="apple" draggable="true">🍎</div>
      <div class="apple" draggable="true">🍎</div>
      <div class="apple" draggable="true">🍎</div>
      <div class="apple" draggable="true">🍎</div>
      <div class="apple" draggable="true">🍎</div>
      <div class="apple" draggable="true">🍎</div>
      <div class="apple" draggable="true">🍎</div>
    </div>
  </div>
</div>

<!-- الأطفال -->
<div class="scene">
  <div class="box child"><div class="box-title">طفل</div><div class="items"></div></div>
  <div class="box child"><div class="box-title">طفل</div><div class="items"></div></div>
  <div class="box child"><div class="box-title">طفل</div><div class="items"></div></div>
  <div class="box child"><div class="box-title">طفل</div><div class="items"></div></div>
</div>

<!-- النتيجة -->
<div id="result">➑ ÷ ➃ = ➋</div>

<footer>القِسمة = توزيع متساوٍ</footer>

</main>

<script>
let dragged=null;

/* السحب */
document.querySelectorAll(".apple").forEach(a=>{
  a.addEventListener("dragstart",()=>dragged=a);
});

/* الإسقاط */
document.querySelectorAll(".items").forEach(area=>{
  area.addEventListener("dragover",e=>e.preventDefault());
  area.addEventListener("drop",()=>{
    if(dragged){
      area.appendChild(dragged);
      dragged=null; check();
    }
  });
});

/* التحقق */
function check(){
  const boxes=[...document.querySelectorAll(".child .items")];
  const counts=boxes.map(b=>b.children.length);
  if(counts.every(c=>c===٢)){
    document.getElementById("result").style.display="block";
  }
}
</script>

</body>
</html>
