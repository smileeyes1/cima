<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محرك الرياضيات الذكي - النسخة المعاد هندستها</title>

<style>

*{
  box-sizing:border-box;
  font-family:"Cairo","Tahoma",sans-serif;
}

body{
  margin:0;
  background:#e9f3f4;
}

.panel{
  background:#fff;
  padding:15px;
  border-bottom:3px solid #1b5e20;
}

.row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

label{
  font-size:12px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.gen{background:#1b5e20;color:white;}
.prt{background:#1565c0;color:white;}

.page{
  width:210mm;
  min-height:297mm;
  background:white;
  margin:15px auto;
  padding:12mm;
}

.title{
  text-align:center;
  font-size:24px;
  color:#1b5e20;
  font-weight:bold;
}

.subtitle{
  text-align:center;
  font-size:12px;
  color:#666;
}

.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:10px;
  font-size:11px;
}

.meta div{
  padding:6px;
  border-radius:6px;
  background:#f7f7f7;
  border:1px solid #ddd;
}

.student{
  margin-top:10px;
  padding:10px;
  border:2px dashed #888;
  border-radius:10px;
}

.line{
  display:inline-block;
  width:180px;
  border-bottom:1px solid #000;
}

.q{
  margin-top:12px;
  padding:12px;
  border-radius:14px;
  border:1px solid #d0d7d7;
  background:linear-gradient(180deg,#fff,#f9fbfb);
}

.q-header{
  font-size:13px;
  font-weight:bold;
  color:#1b5e20;
  margin-bottom:6px;
}

.visual{
  text-align:center;
  font-size:18px;
  margin:6px 0;
}

.math{
  display:flex;
  justify-content:center;
  gap:8px;
  font-size:22px;
  align-items:center;
}

.answer{
  width:55px;
  height:34px;
  border:2px dashed #444;
  border-radius:6px;
}

@media print{
  .panel{display:none;}
  body{background:white;}
  .page{margin:0;}
}

@page{size:A4;margin:0;}

</style>
</head>

<body>

<div class="panel">

<h3>محرك الرياضيات الذكي - النسخة المعاد هندستها</h3>

<div class="row">

<div>
<label>المهارة</label>
<select id="skill">
<option value="mix">مختلط</option>
<option value="add">الجمع</option>
<option value="sub">الطرح</option>
<option value="compare">المقارنة</option>
<option value="order">الترتيب</option>
<option value="count">العدّ</option>
</select>
</div>

<div>
<label>الحد العددي</label>
<select id="limit">
<option value="10">ضمن 10</option>
<option value="20">ضمن 20</option>
<option value="100">ضمن 100</option>
</select>
</div>

<div>
<label>عدد الأسئلة</label>
<input id="count" type="number" value="10">
</div>

<div>
<label>اسم الدرس</label>
<input id="lesson" value="رياضيات">
</div>

</div>

<div class="row">

<div>
<label>المعلم</label>
<input id="teacher" value="المعلم">
</div>

<div>
<label>المدرسة</label>
<input id="school" value="مدرسة">
</div>

<div></div>
<div></div>

</div>

<button class="gen" onclick="build()">توليد</button>
<button class="prt" onclick="window.print()">طباعة</button>

</div>

<div id="out"></div>

<script>

/* ================= أدوات ================= */

function ar(n){
  return String(n).replace(/[0-9]/g,d=>
    ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][d]
  );
}

function rand(max){
  return Math.floor(Math.random()*(max+1));
}

/* ================= بصمة السؤال (إغلاق التكرار الحقيقي) ================= */

let used = new Set();

function fingerprint(d){
  return JSON.stringify(d);
}

/* ================= توليد موحد ================= */

function generate(skill,limit){

  let a,b,c;

  switch(skill){

    case "add":
      do{
        a=rand(limit); b=rand(limit);
      }while(a+b>limit || a===0 || b===0);
      return {type:"add",a,b};

    case "sub":
      a=rand(limit);
      b=rand(a);
      return {type:"sub",a,b};

    case "compare":
      a=rand(limit); b=rand(limit);
      if(a===b) b=(b+1)%(limit+1);
      return {type:"compare",a,b};

    case "order":
      do{
        a=rand(limit); b=rand(limit); c=rand(limit);
      }while(a===b || a===c || b===c);
      return {type:"order",a,b,c};

    case "count":
      a=Math.max(1,rand(limit));
      return {type:"count",a};

    case "mix":
      let skills=["add","sub","compare","order","count"];
      return generate(skills[rand(skills.length-1)],limit);
  }
}

/* ================= تحقق ================= */

function validate(d,skill,limit){

  if(skill==="add" && d.a + d.b > limit) return false;
  if(skill==="sub" && d.b > d.a) return false;
  if(skill==="order" && (d.a===d.b||d.b===d.c||d.a===d.c)) return false;

  return true;
}

/* ================= fallback ذكي ================= */

function fallback(skill){

  return {
    add:{type:"add",a:1,b:1},
    sub:{type:"sub",a:2,b:1},
    compare:{type:"compare",a:1,b:2},
    order:{type:"order",a:1,b:2,c:3},
    count:{type:"count",a:1},
    mix:{type:"count",a:1}
  }[skill] || {type:"count",a:1};
}

/* ================= توليد مستقر ================= */

function stableGenerate(skill,limit){

  let d;
  let tries=0;

  while(tries<40){

    d=generate(skill,limit);

    if(!validate(d,skill,limit)){
      tries++;
      continue;
    }

    let fp=fingerprint(d);

    if(used.has(fp)){
      tries++;
      continue;
    }

    used.add(fp);
    return d;
  }

  return fallback(skill);
}

/* ================= عرض ================= */

function render(d){

  if(d.type==="add"){
    return `
    <div class="q">
      <div class="q-header">الجمع</div>
      <div class="visual">🍎➕🍌</div>
      <div class="math">
        <span>${ar(d.a)}</span>
        <span>+</span>
        <span>${ar(d.b)}</span>
        <span>=</span>
        <span class="answer"></span>
      </div>
    </div>`;
  }

  if(d.type==="sub"){
    return `
    <div class="q">
      <div class="q-header">الطرح</div>
      <div class="visual">🍎➖🍌</div>
      <div class="math">
        <span>${ar(d.a)}</span>
        <span>-</span>
        <span>${ar(d.b)}</span>
        <span>=</span>
        <span class="answer"></span>
      </div>
    </div>`;
  }

  if(d.type==="compare"){
    return `
    <div class="q">
      <div class="q-header">قارن</div>
      <div class="math">
        <span>${ar(d.a)}</span>
        <span>___</span>
        <span>${ar(d.b)}</span>
      </div>
    </div>`;
  }

  if(d.type==="order"){
    return `
    <div class="q">
      <div class="q-header">رتب</div>
      <div class="math">
        <span>${ar(d.a)}</span>
        <span>${ar(d.b)}</span>
        <span>${ar(d.c)}</span>
      </div>
    </div>`;
  }

  if(d.type==="count"){
    return `
    <div class="q">
      <div class="q-header">عدّ</div>
      <div class="visual">
        ${"⭐ ".repeat(Math.max(1,d.a))}
      </div>
      <div class="math">
        <span class="answer"></span>
      </div>
    </div>`;
  }

  return `<div class="q"></div>`;
}

/* ================= بناء ================= */

function build(){

  used.clear();

  let skill=document.getElementById("skill").value;
  let limit=parseInt(document.getElementById("limit").value);
  let count=parseInt(document.getElementById("count").value);
  let lesson=document.getElementById("lesson").value;
  let teacher=document.getElementById("teacher").value;
  let school=document.getElementById("school").value;

  let html=`
  <div class="page">

    <div class="title">${lesson}</div>
    <div class="subtitle">محرك تعليمي ذكي متوازن - النسخة النهائية</div>

    <div class="meta">
      <div>المعلم: ${teacher}</div>
      <div>المدرسة: ${school}</div>
      <div>الحد: ${ar(limit)}</div>
    </div>

    <div class="student">
      اسم الطالب: <span class="line"></span>
    </div>
  `;

  for(let i=1;i<=count;i++){
    let d=stableGenerate(skill,limit);
    html+=render(d);
  }

  html+=`</div>`;

  document.getElementById("out").innerHTML=html;
}

build();

</script>

</body>
</html>
