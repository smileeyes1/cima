<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مولّد أوراق عمل AI</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial;
    background:#0f1115;
    color:white;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    color:#00ffd0;
}

input, textarea{
    width:100%;
    margin-top:10px;
    padding:12px;
    font-size:18px;
    border:none;
    border-radius:10px;
    outline:none;
    background:#1c1f26;
    color:white;
    direction:rtl;
    text-align:right;
}

textarea{
    height:140px;
}

button{
    width:100%;
    margin-top:10px;
    padding:14px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
}

.ai{background:#00ffd0;color:black;}
.print{background:#ffb703;color:black;}
.clear{background:#ef233c;color:white;}

#paper{
    margin-top:20px;
    padding:25px;
    background:white;
    color:black;

    width:210mm;
    min-height:297mm;

    border-radius:10px;

    direction:rtl;
    text-align:right;
    line-height:2.2;
    white-space:pre-wrap;
}

.title{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-bottom:15px;
}

/* طباعة */
@media print {
    body{
        background:white;
    }

    .container > *:not(#paper){
        display:none;
    }

    #paper{
        width:100%;
        min-height:auto;
        border:none;
        border-radius:0;
    }
}

</style>
</head>

<body>

<div class="container">

<h1>مولّد أوراق عمل بالذكاء الاصطناعي</h1>

<input id="apiKey" placeholder="أدخل API KEY هنا">

<input id="title" placeholder="عنوان الورقة">

<textarea id="prompt" placeholder="اكتب موضوع الورقة أو التعليمات (مثال: أسئلة عن الجمع ضمن 10)"></textarea>

<button class="ai" onclick="generateAI()">توليد بالذكاء الاصطناعي</button>
<button class="print" onclick="window.print()">طباعة</button>
<button class="clear" onclick="clearAll()">مسح</button>

<div id="paper">

<div class="title" id="paperTitle"></div>

<div id="paperContent"></div>

</div>

</div>

<script>

async function generateAI(){

    let apiKey = document.getElementById("apiKey").value;
    let title = document.getElementById("title").value;
    let prompt = document.getElementById("prompt").value;

    if(!apiKey){
        alert("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");
        return;
    }

    if(!prompt){
        alert("أدخل موضوع الورقة");
        return;
    }

    document.getElementById("paperTitle").innerText = "جاري التوليد...";
    document.getElementById("paperContent").innerText = "انتظر...";

    try{

        const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=" + apiKey, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                contents: [{
                    parts: [{
                        text: "اكتب ورقة عمل A4 باللغة العربية فقط. كل سؤال في سطر. بدون شرح. الموضوع: " + prompt
                    }]
                }]
            })
        });

        const data = await response.json();

        let output = data.candidates?.[0]?.content?.parts?.[0]?.text || "لم يتم الحصول على نتيجة";

        // تنسيق بسيط
        let lines = output.split("\n").filter(l => l.trim() !== "");
        let formatted = lines.map((q, i) => (i+1) + " - " + q).join("\n");

        document.getElementById("paperTitle").innerText = title || "ورقة عمل";
        document.getElementById("paperContent").innerText = formatted;

    }catch(e){
        document.getElementById("paperContent").innerText = "حدث خطأ في الاتصال";
    }
}

function clearAll(){
    document.getElementById("title").value = "";
    document.getElementById("prompt").value = "";
    document.getElementById("paperTitle").innerText = "";
    document.getElementById("paperContent").innerText = "";
}

</script>

</body>
</html>
