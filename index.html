<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام أوراق العمل الذكي</title>

<style>

*{
  box-sizing:border-box;
  font-family:"Cairo","Tahoma",sans-serif;
}

body{
  margin:0;
  background:#eef2f3;
}

/* لوحة التحكم */
.panel{
  background:white;
  padding:15px;
  border-bottom:3px solid #2e7d32;
}

.row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

label{
  font-size:12px;
  font-weight:bold;
  display:block;
  margin-top:6px;
}

input,select{
  width:100%;
  padding:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.gen{background:#2e7d32;color:white;}
.prt{background:#1565c0;color:white;}

/* الصفحة */
.page{
  width:210mm;
  min-height:297mm;
  background:white;
  margin:15px auto;
  padding:12mm;
}

.title{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  color:#1b5e20;
}

/* معلومات */
.meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  font-size:11px;
  margin-top:10px;
}

.meta div{
  border:1px solid #ddd;
  padding:6px;
  border-radius:6px;
  background:#fafafa;
}

/* اسم الطالب */
.student-box{
  margin-top:10px;
  padding:10px;
  border:2px dashed #999;
  border-radius:10px;
  font-size:13px;
}

.line{
  display:inline-block;
  width:200px;
  border-bottom:1px solid #000;
}

/* الهدف */
.objectives{
  margin-top:10px;
  padding:8px;
  background:#f1f8e9;
  border-right:4px solid #43a047;
  font-size:12px;
}

/* السؤال */
.q{
  border:1px solid #d0d7de;
  padding:10px;
  margin-top:10px;
  border-radius:12px;
}

.emoji{
  font-size:18px;
  margin:2px;
}

.math{
  display:flex;
  justify-content:center;
  gap:8px;
  font-size:20px;
  margin-top:8px;
}

.answer{
  width:50px;
  height:32px;
  border:2px dashed #444;
  border-radius:6px;
}

/* طباعة */
@media print{
  .panel{display:none;}
  body{background:white;}
  .page{margin:0;}
}

@page{
  size:A4;
  margin:0;
}

</style>
</head>

<body>

<div class="panel">

<h3>نظام أوراق العمل الذكي</h3>

<div class="row">

<div>
<label>الصف</label>
<select id="grade">
<option value="1">الأول</option>
<option value="2" selected>الثاني</option>
</select>
</div>

<div>
<label>نوع الدرس</label>
<select id="type">
<option value="add">الجمع</option>
<option value="sub">الطرح</option>
<option value="mix">جمع وطرح</option>
</select>
</div>

<div>
<label>عدد الأسئلة</label>
<input id="count" type="number" value="10">
</div>

<div>
<label>اسم المعلم</label>
<input id="teacher" value="المعلم">
</div>

</div>

<div class="row">

<div>
<label>اسم الدرس الكامل</label>
<input id="lesson" value="الجمع والطرح ضمن العدد 10">
</div>

<div>
<label>المدرسة</label>
<input id="school" value="مدرسة">
</div>

<div>
<label>إظهار الإجابات</label>
<select id="answers">
<option value="no">لا</option>
<option value="yes">نعم</option>
</select>
</div>

<div>
<label>المستوى</label>
<select id="level">
<option value="1">سهل</option>
<option value="2" selected>متوسط</option>
<option value="3">متقدم</option>
</select>
</div>

</div>

<button class="gen" onclick="build()">توليد</button>
<button class="prt" onclick="window.print()">طباعة</button>

</div>

<div id="out"></div>

<script>

/* تحويل الأرقام إلى شرقية */
function ar(n){
  return String(n).replace(/[0-9]/g,d=>
    ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][d]
  );
}

/* رموز */
function emojis(){
  return ["🍎","🍌","⭐","📘"];
}

/* أرقام حسب المستوى */
function rand(level){
  if(level==1) return Math.floor(Math.random()*6);
  if(level==2) return Math.floor(Math.random()*10);
  return Math.floor(Math.random()*20);
}

/* سؤال */
function q(i,a,b,type,em,showAns){

  let op = type=="sub" ? "-" : "+";
  let res = type=="sub" ? (a-b) : (a+b);

  let icons = Array(Math.min(a,5))
    .fill(`<span class="emoji">${em}</span>`)
    .join('');

  return `
  <div class="q">

    <b>السؤال ${ar(i)}</b>

    <div style="text-align:center;margin-top:6px">
      ${icons}
    </div>

    <div class="math">
      <span>${ar(a)}</span>
      <span>${op}</span>
      <span>${ar(b)}</span>
      <span>=</span>
      <span class="answer"></span>
      ${showAns ? `<span style="font-size:12px;color:green">(${ar(res)})</span>` : ""}
    </div>

  </div>`;
}

/* بناء الورقة */
function build(){

  let g=ar(document.getElementById("grade").value);
  let type=document.getElementById("type").value;
  let level=document.getElementById("level").value;
  let count=parseInt(document.getElementById("count").value);
  let teacher=document.getElementById("teacher").value;
  let school=document.getElementById("school").value;
  let lesson=document.getElementById("lesson").value;
  let showAns=document.getElementById("answers").value=="yes";

  let em=emojis();

  let html=`
  <div class="page">

    <div class="title">${lesson}</div>

    <div class="meta">
      <div>الصف: ${g}</div>
      <div>المعلم: ${teacher}</div>
      <div>المدرسة: ${school}</div>
    </div>

    <div class="student-box">
      اسم الطالب: <span class="line"></span>
    </div>

    <div class="objectives">
      الهدف: تنمية مهارات الحساب الأساسية بطريقة ممتعة وتدرّجية.
    </div>
  `;

  for(let i=1;i<=count;i++){

    let a=rand(level);
    let b=rand(level);

    if(type=="sub" && b>a){
      let t=a;a=b;b=t;
    }

    if(type=="mix"){
      type = Math.random()>0.5 ? "add" : "sub";
    }

    html+=q(i,a,b,type,em[i%em.length],showAns);
  }

  html+=`</div>`;

  document.getElementById("out").innerHTML=html;
}

build();

</script>

</body>
</html>
