<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تطبيق مواقع الافلام العربية</title>

  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    header {
      background: #222;
      padding: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .btn {
      display: inline-block;
      margin: 5px;
      padding: 12px 18px;
      background: #e91e63;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .btn:hover { background: #c2185b; }

    .top-controls {
      margin-top: 10px;
    }

    #message {
      margin: 20px;
      font-size: 18px;
      color: #ffeb3b;
    }

    /* فلتر css لاخفاء اعلانات */
    [class*="ad"], [id*="ad"], [class*="banner"], [class*="popup"], [class*="overlay"], div[style*="position: fixed"] {
      display: none !important;
    }
  </style>
</head>

<body>

  <header>
    <button class="btn" onclick="openSite('https://wecima.click')">وي سيما</button>
    <button class="btn" onclick="openSite('https://cfu.cam')">سيما فور يو</button>
    <button class="btn" onclick="openSite('https://shahheid4u.net')">شاهد فور يو</button>
    <button class="btn" onclick="openSite('https://egibest.fan')">ايجي بست</button>

    <div class="top-controls">
      <button class="btn" onclick="window.location.reload()">تحديث</button>
    </div>
  </header>

  <div id="message">
    اضغط على الزر لفتح الموقع في تبويب جديد  
    جرب تشغيل VPN اذا لم يفتح (مثل ProtonVPN مجاني)  
    اذا ما زال لا يعمل ابحث في جوجل عن الاسم + "رابط جديد ٢٠٢٦"
  </div>

  <script>
    function openSite(url) {
      window.open(url, '_blank');
    }

    // فلتر اعلانات بسيط
    const adKeywords = ["ads", "banner", "popup", "overlay", "sponsored"];
    setInterval(() => {
      document.querySelectorAll('div, iframe').forEach(el => {
        adKeywords.forEach(key => {
          if (el.innerHTML.toLowerCase().includes(key) || (el.src && el.src.includes(key))) {
            el.remove();
          }
        });
      });
    }, ١٠٠٠);
  </script>

</body>
</html>
